<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8;--ink:#1B1E26;--soft:#555C6B;--faint:#868C9B;--rule:#DCDFE6;
  --ai:#22386A;--daiji:#22386A;--ai-tint:#E9EDF6;--warn:#8F5600;--warn-tint:#FBF0DD;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111318;--ink:#E7E9EF;--soft:#A6ACBA;--faint:#777E8E;--rule:#2A2F3A;
    --ai:#93ABE8;--daiji:#2B4580;--ai-tint:#1A2132;--warn:#E3A84E;--warn-tint:#2A2216;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111318;--ink:#E7E9EF;--soft:#A6ACBA;--faint:#777E8E;--rule:#2A2F3A;
  --ai:#93ABE8;--daiji:#2B4580;--ai-tint:#1A2132;--warn:#E3A84E;--warn-tint:#2A2216;
}
:root[data-mode="light"]{
  color-scheme:light;
  --bg:#F5F6F8;--ink:#1B1E26;--soft:#555C6B;--faint:#868C9B;--rule:#DCDFE6;
  --ai:#22386A;--daiji:#22386A;--ai-tint:#E9EDF6;--warn:#8F5600;--warn-tint:#FBF0DD;
}
:root[data-mode="dark"]{
  color-scheme:dark;
  --bg:#111318;--ink:#E7E9EF;--soft:#A6ACBA;--faint:#777E8E;--rule:#2A2F3A;
  --ai:#93ABE8;--daiji:#2B4580;--ai-tint:#1A2132;--warn:#E3A84E;--warn-tint:#2A2216;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:20px;padding-right:20px}
a{color:var(--ai);text-underline-offset:3px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--ai);outline-offset:3px;border-radius:2px}
p{margin:0 0 .9em}

.mast{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding-top:26px;padding-bottom:22px}
.daiji{font-family:var(--mincho);font-weight:800;font-size:40px;line-height:1.08;background:var(--daiji);color:var(--daiji-ink,#fff);padding:12px 10px;border-radius:2px;margin:0;text-align:center}
.daiji span{display:block}
.ed-date{font-family:var(--mincho);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.15;margin:2px 0 6px;letter-spacing:.02em}
.ed-sub{color:var(--soft);font-size:14px;margin:0 0 4px;line-height:1.6}
.ed-sub span{display:block}
.ed-stat{font-size:13px;color:var(--soft);margin:0;line-height:1.6}
.ed-back{font-size:13px;margin:6px 0 0}
.ed-warn{font-size:13px;margin:6px 0 0;color:var(--warn)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;align-items:center;gap:8px}
.tab-links{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0}
.mode-btn{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;line-height:1.6;color:var(--soft);background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 12px;cursor:pointer}
.mode-btn[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.mode-btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.tabs a{flex:0 0 auto;padding:12px 14px 11px;color:var(--soft);text-decoration:none;font-size:15px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ai)}

main{padding:6px 0 64px}
.note{font-size:13.5px;color:var(--soft);margin:18px 0 4px}
.msg{padding:48px 0;color:var(--soft)}
.msg strong{display:block;color:var(--ink);font-family:var(--mincho);font-size:20px;margin-bottom:8px}

.story{border-bottom:1px solid var(--rule)}
.story summary{list-style:none;cursor:pointer;padding:22px 0 20px}
.story summary::-webkit-details-marker{display:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px}
.cat{color:var(--ai);font-weight:700}
.when{color:var(--faint)}
.badge{font-weight:600}
.badge.ok{color:var(--ai)}
.badge.partial{color:var(--warn)}
.story h2{font-family:var(--mincho);font-weight:600;font-size:21px;line-height:1.5;margin:6px 0 8px}
.lede{color:var(--soft);font-size:15px;margin:0}
.toggle{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--ai)}
.toggle::after{content:"解説を読む ＋"}
.story[open] .toggle::after{content:"閉じる −"}
.body{padding:0 0 30px}
.points{list-style:none;margin:0;padding:14px 16px;background:var(--ai-tint);border-radius:6px}
.points li{position:relative;padding-left:1.1em;font-size:15px;line-height:1.75}
.points li+li{margin-top:8px}
.points li::before{content:"";position:absolute;left:0;top:.72em;width:.42em;height:.42em;background:var(--ai);border-radius:50%}
.body h3{font-family:var(--mincho);font-weight:600;font-size:17.5px;margin:28px 0 8px;line-height:1.4}
.check{margin-top:28px;padding:12px 16px;border-left:3px solid var(--ai);background:var(--ai-tint);font-size:14px;line-height:1.75}
.check.partial{border-color:var(--warn);background:var(--warn-tint)}
.check b{display:block;margin-bottom:2px}
.src{margin:18px 0 0;padding:0;list-style:none;font-size:13.5px;line-height:1.6}
.src li{margin:0 0 8px}
.src-h{font-size:13px;color:var(--faint);margin:20px 0 6px;font-weight:600}

.hist-h{font-family:var(--mincho);font-weight:800;font-size:26px;margin:24px 0 4px}
.hist-sub{color:var(--soft);font-size:14px;margin:0 0 8px}
.hist{display:grid;grid-template-columns:76px 1fr;gap:4px 16px;padding:24px 0;border-bottom:1px solid var(--rule)}
.year{font-family:var(--mincho);font-weight:800;font-size:28px;line-height:1.1;color:var(--ai)}
.year small{display:block;font-family:var(--gothic);font-weight:500;font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.4}
.hist h3{font-family:var(--mincho);font-weight:600;font-size:19px;line-height:1.5;margin:0 0 8px}
.tie{margin:6px 0 0;padding:10px 14px;background:var(--ai-tint);border-radius:6px;font-size:14px;line-height:1.75}
.tie b{color:var(--ai)}
.hist .src{margin-top:12px}

.arch{display:block;padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.arch-d{font-family:var(--mincho);font-weight:600;font-size:20px}
.arch-d span{font-family:var(--gothic);font-size:13px;color:var(--faint);font-weight:500;margin-left:10px}
.arch-t{margin:4px 0 0;color:var(--soft);font-size:14px;line-height:1.65}
.arch[aria-current="true"] .arch-d::after{content:"表示中";font-family:var(--gothic);font-size:12px;font-weight:600;color:var(--ai);margin-left:10px}
.foot{color:var(--faint);font-size:12.5px;margin-top:36px;line-height:1.7}

@media (max-width:420px){
  .wrap{padding-left:16px;padding-right:16px}
  .daiji{font-size:34px;padding:10px 8px}
  .hist{grid-template-columns:1fr}
  .year{font-size:24px}
  .year small{display:inline;margin-left:8px}
}
</style>
</head>

  <h1 class="daiji" aria-label="暁報"><span>暁</span><span>報</span></h1>

    <p class="ed-sub" id="edSub"></p>

  </div>
</header>

(function(){
  var DATA={"editions": [{"date": "2026-11-12", "newsDate": "2026-11-11", "note": "検索で11日当日の報道を直接確認できた記事が少なく、全5本を「partial」としています。", "stories": [{"id": "s1", "cat": "政治・経済", "when": "11月11日", "title": "消費減税法案、参院で審議入り 首相が出席", "lede": "衆院を通過した消費税減税関連法案が、参院本会議で審議入りした。与党は参院で過半数に届かず、野党の協力が成立の鍵となる。", "points": ["法案は6日の衆院本会議で自民、維新などの賛成多数で可決され、参院に送付された。", "参院は与党が過半数に届かず、国民民主党と公明党への働き掛けが焦点になる。", "政府・与党は12月12日の会期末までの成立を目指している。"], "background": "衆院では年5兆円規模とされる財源や新たな給付の制度設計が十分に示されず、野党は説明が曖昧だと批判した。参院でも財源が論戦の中心になる見通し。", "precedents": "日本の消費税は1989年の導入後、1997年に5%、2014年に8%、2019年に10%へ段階的に引き上げられてきた。税率を下げる法案が国会で審議されるのは異例である。", "history": "消費税は1989年に3%で始まった。以後、税率引き上げは延期や軽減税率の導入など政治的な争点となり、政権の命運を左右することもあった。", "outlook": "国民民主・公明が賛成に回るか、財源の裏付けが示されるかが焦点。会期末までに採決へ進めるかを見たい。", "check": {"level": "partial", "note": "衆院通過と日程は複数媒体で確認。11日に実際に審議入りした点と首相答弁の詳細は直接確認できていない。"}, "sources": [{"name": "熊本日日新聞｜消費減税、衆院で論戦スタート 法案審議入り、飲食料品1%", "url": "https://kumanichi.com/articles/2048549"}, {"name": "神奈川新聞（カナロコ）｜消費減税関連の記事", "url": "https://www.kanaloco.jp/news/social/article-1313854.html"}, {"name": "熊本日日新聞｜消費減税、野党に協力要請 小林氏「参院で少数与党」", "url": "https://kumanichi.com/articles/2041776"}]}, {"id": "s2", "cat": "外交", "when": "11月11日", "title": "台湾、APEC首脳会議に特使派遣へ 対等参加求める", "lede": "台湾は、中国・深圳で開かれるAPEC首脳会議に特使を送る方向だと報じられた。台湾側は対等で尊厳ある参加を求めている。", "points": ["首脳会議は11月18〜19日に深圳で開かれる。", "卓栄泰首相は、特使が招待状を直接届ける慣例に沿うよう中国に求めた。", "中国側はメールで連絡し、正式な招待状ではないと台湾側は受け止めている。"], "background": "台湾はAPECに「チャイニーズ・タイペイ」の名で参加している。中国が議長国のため、参加の形式をめぐる駆け引きが起きやすい。", "precedents": "2024年のペルー会議では、台湾が最初に指名した陳建仁・元副総統が開催国に受け入れられず、宏碁（エイサー）創業者の施振栄氏に代わった。", "history": "台湾は1991年にAPECへ加盟した。首脳会議には総統でなく特使を送るのが通例で、これは中台の取り決めの名残である。", "outlook": "正式な招待状が届くか、台湾が出席を最終決定するかが注目点。", "check": {"level": "partial", "note": "11月3日の台湾側報道で、招待の形式と対等参加の要求を確認。11日の特使決定は直接確認できていない。"}, "sources": [{"name": "Focus Taiwan｜APEC招待をめぐる行政院長の発言（11月3日）", "url": "https://focustaiwan.tw/politics/202611030015"}, {"name": "Taipei Times｜APEC深圳会議への台湾の参加をめぐる報道（9月21日）", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/21/2003864622"}]}, {"id": "s3", "cat": "外交", "when": "11月12日", "title": "米中外相が電話会談 APEC・G20成功へ協力", "lede": "米中の外相が電話で会談し、王毅氏は意思疎通と協力の強化を訴えたと報じられた。APEC首脳会議などを控えた調整とみられる。", "points": ["王毅外相が意思疎通と協力の強化を呼びかけたと新華社が伝えた。", "日本の報道は、APECとG20の首脳会議の成功に向けた相互協力を伝えている。", "会談の詳細は、当日の報道の範囲では限られている。"], "background": "米中は首脳級の往来を重ねる局面にあり、外相間の電話は首脳会談前の地ならしとして行われることが多い。", "precedents": "2025年10月27日にも、韓国でのAPEC首脳会議に合わせた米中首脳会談の前に、王氏とルビオ国務長官が電話会談をした。", "history": "米中は1979年に国交を正常化した。以後、台湾問題や通商をめぐり、緊張と対話を繰り返してきた。", "outlook": "深圳APECに合わせた米中首脳会談が実現するか、成果文書に何が入るかが焦点。", "check": {"level": "partial", "note": "過去の電話会談の事実は確認。今回の通話内容は日本の見出し情報のみで、一次情報や英文報道は確認できていない。"}, "sources": [{"name": "Caixin｜Wang Yi, Rubio hold phone call as China, US seek to steady relations", "url": "https://www.caixinglobal.com/2025-10-28/wang-yi-rubio-hold-phone-call-as-china-us-seek-to-steady-relations-102376208.html"}, {"name": "Vietnam News｜Chinese FM Wang, US Secretary of State Rubio hold phone call", "url": "https://vietnamnews.vn/world/1728307/chinese-foreign-minister-wang-us-secretary-of-state-rubio-hold-phone-call-in-preparation-for-high-level-engagements.html"}]}, {"id": "s4", "cat": "国際", "when": "11月11日", "title": "米中ロ首脳会談、核とAIの規制を議論か 香港紙", "lede": "米中ロの首脳会談が実現した場合、核兵器へのAI利用の規制が議題になる可能性があると香港紙が報じた。実現は確定していない。", "points": ["香港紙の報道を共同通信などが伝えた。政府の公式発表ではない。", "米中は、深圳APECに合わせた首脳会談でAI協力を成果の候補にしていると報じられている。", "米ロ首脳会談は来週調整中と報じられたが、確認できていない。"], "background": "AIの軍事利用が広がる中、核兵器の指揮統制に人工知能を関与させない取り決めが各国で課題になっている。", "precedents": "2024年11月のリマでの米中首脳会談では、核兵器使用の判断は人間が行うべきだとの認識が確認されたと報じられた。", "history": "米ソは冷戦期に戦略兵器制限交渉（SALT）などで核の管理を進めた。中国を含む三者の枠組みは前例がない。", "outlook": "三者会談が開かれるか、核とAIが議題になるかを見たい。", "check": {"level": "partial", "note": "米中のAI協力の準備は報道で確認。米中ロ会談と核AI規制の議論は、今回の検索で独立に確認できていない。"}, "sources": [{"name": "SCMP｜US and China race to shape AI agenda ahead of Xi-Trump talks in Shenzhen", "url": "https://scmp.com/news/china/diplomacy/article/3370926/us-and-china-race-shape-ai-agenda-ahead-xi-trump-talks-shenzhen-sources-say"}, {"name": "Yahoo News｜China's Xi pushes for global AI body at APEC", "url": "https://www.yahoo.com/news/articles/chinas-xi-pushes-global-ai-045049885.html"}]}, {"id": "s5", "cat": "外交", "when": "11月12日", "title": "米、台湾政府機関へ連邦職員を派遣へ 新制度", "lede": "米国が連邦政府職員を台湾の政府機関に派遣する新たな制度を設けると、共同通信やロイターが報じた。米台の関係強化の動きとなる。", "points": ["報道では、米連邦職員が台湾で最長1年勤務する仕組みとされる。", "派遣先や人数など制度の詳細は、今回の検索では確認できていない。", "米国には、職員を台湾に派遣する根拠規定がすでにある。"], "background": "米国は台湾との実務的な結びつきを強めており、職員を相手側機関で働かせる制度は、政策の連携を深める手段になる。", "precedents": "2022年12月の国防権限法に台湾フェローシップ法が盛り込まれ、毎年10人以上の職員を台湾に送る枠組みが作られた。", "history": "米国は1979年に台湾と断交し、台湾関係法を制定した。以来、米国在台協会（AIT）を窓口に実務関係を続けている。", "outlook": "制度の運用開始時期と、中国側の反応が焦点となる。", "check": {"level": "partial", "note": "既存の台湾フェローシップ制度は確認。今回報じられた新制度そのものは、検索で独立に確認できていない。"}, "sources": [{"name": "Taipei Times｜台湾フェローシップ法に関する報道（2023年1月10日）", "url": "https://www.taipeitimes.com/News/taiwan/archives/2023/01/10/2003792327"}, {"name": "米国法典 22 U.S.C. § 3386", "url": "https://www.govinfo.gov/link/uscode/22/3386"}]}]}, {"date": "2026-11-11", "newsDate": "2026-11-10", "note": "", "stories": [{"id": "s1", "cat": "外交", "when": "11月10日", "title": "日中首脳会談、APEC前に調整不調と報道", "lede": "18日からのAPECを前に、日中首脳会談の実現に向けた調整が不調に終わったと共同通信などが報じた。中国側が応じていないという。", "points": ["共同通信は、中国側が首相の国会答弁に反発し会談を拒否していると独自報道した。", "10月上旬には、中国が習近平氏ではなく李強首相との会談を提案したとの香港紙報道があった。", "首相は16日からフィリピンと中国を訪れ、ASEAN・APEC首脳会議に出席する予定。"], "background": "高市首相は2025年11月、台湾有事が存立危機事態になり得るとの趣旨の国会答弁をした。中国は撤回を求め続けており、対話の再開条件として位置づけているとみられる。日本政府は答弁を変えない姿勢で、双方の溝が続いている。", "precedents": "2012年の尖閣国有化後、日中首脳が正式に会談できたのは2014年11月、北京APECでの安倍・習会談まで約2年かかった。この時は4項目の合意文書でようやく糸口を作った。", "history": "日中は1972年の国交正常化以来、共同声明など4つの政治文書を土台にしてきた。台湾問題は一貫して最も敏感な論点で、日本は「中国の立場を十分理解し尊重する」との表現で線を引いてきた。", "outlook": "APEC本番で立ち話や短時間の接触が行われるか、中国が李強首相との会談を再提示するかが焦点となる。", "check": {"level": "partial", "note": "調整不調は共同通信系の独自報道。検索では10月の香港紙報道の転載のみ確認でき、両政府の公式発表は未確認。"}, "sources": [{"name": "Nation Thailand｜Japan-China summit faces uncertainty ahead of APEC meeting", "url": "https://www.nationthailand.com/news/world/40073263"}, {"name": "nippon.com（時事）｜APEC首脳会談を巡る日中の調整", "url": "https://www.nippon.com/ja/news/yjj2026100800344/"}, {"name": "Kyung Hyang Shinmun｜日中首脳会談を巡る報道", "url": "https://www.khan.co.kr/en/article/202610081555027"}]}, {"id": "s2", "cat": "国際", "when": "11月10日", "title": "G7外相会合が閉幕、ウクライナの電力支援で一致", "lede": "パリで開かれたG7外相会合が2日間の日程を終えた。冬を前に、攻撃で弱った電力インフラへの支援継続と、完全な停戦の重要性を確認した。", "points": ["茂木外相によると、冬を越すためのエネルギー支援に取り組むことで一致した。", "ウクライナのシビハ外相も出席し、弾道ミサイル攻撃で傷んだ電力分野が議題になった。", "米露ウクライナの高官協議が10〜11日に予定され、EUのカラス氏は露側の譲歩が必要と述べた。"], "background": "ロシアは2022年秋以降、ウクライナの発電所や送電網を繰り返し攻撃してきた。厳しい冬の暖房や給水が脅かされるため、G7は電力機材の供与や復旧支援を重ねている。", "precedents": "2022年10月のG7外相会合（ミュンスター）では、ウクライナの重要インフラ復旧を支援する調整の枠組みを設けた。冬前に電力支援を打ち出す流れは毎年続いている。", "history": "G7は1970年代の経済協議体として始まり、冷戦後は国際政治全般を扱うようになった。ロシアは2014年のクリミア併合を受けてG8から外れ、以後G7が対露対応の中心となっている。", "outlook": "共同声明が公表されるか、その中で制裁や停戦条件にどこまで踏み込むかが焦点となる。米露ウクライナ協議の行方も影響する。", "check": {"level": "partial", "note": "共同通信・読売の報道内容を複数紙で確認。共同声明の公表と全文は未確認。"}, "sources": [{"name": "共同通信｜G7外相、ウクライナ支援一致 ミサイル攻撃で弱体化の電力分野", "url": "https://news.yahoo.co.jp/articles/5571833020df83865f26280b12ce1db16500b575"}, {"name": "新潟日報（共同）｜Ｇ７外相会合が閉幕", "url": "https://www.niigata-nippo.co.jp/articles/-/940323"}, {"name": "Yahoo!ニュース（読売）｜G7外相会合 ウ支援で声明公表へ", "url": "https://news.yahoo.co.jp/pickup/6602111"}]}, {"id": "s3", "cat": "企業・市場", "when": "11月10日", "title": "りそなHD、M&A仲介大手MACPと資本業務提携", "lede": "りそなHDはM&Aキャピタルパートナーズ（MACP）と資本業務提携を結んだ。社長らの保有株の約5%を取得し、中小企業の事業承継支援を強める。", "points": ["株式取得は11月13日で、取得額は約70億円と報じられた。", "M&Aを望む顧客を相互に紹介し、仲介やFA業務で連携する。", "人材交流でM&A人材も育成する。業績への影響は軽微の見込み。"], "background": "中小企業では経営者の高齢化と後継者不足が進み、事業承継の手段としてM&Aが増えている。銀行は取引先を知る強みがある一方、仲介の専門人材が不足しており、外部との提携で補う狙いがある。", "precedents": "地銀や大手行は近年、M&A仲介会社やベンチャーと提携・出資して法人向け手数料収入を伸ばす動きを強めてきた。りそなも他社との資本業務提携を重ねている。", "history": "日本の銀行は長く融資の利ざやに収益を頼ってきた。1990年代の不良債権問題を経て、手数料ビジネスへの転換が経営課題となった。", "outlook": "紹介件数や成約数がどこまで伸びるか、他行が同様の提携に動くかが注目される。", "check": {"level": "ok", "note": "NHK、テレ東BIZ、日経、ロイター、りそなの適時開示で確認。決算期の表記が報道により異なる。"}, "sources": [{"name": "NHK｜りそなHD M＆A支援体制強化へ 仲介大手と資本業務提携", "url": "https://news.web.nhk/newsweb/na/nd-20261110de73783"}, {"name": "テレ東BIZ｜りそなHD M＆Aキャピタルパートナーズと資本業務提携", "url": "https://txbiz.tv-tokyo.co.jp/you/news/post_352224"}, {"name": "日本経済新聞｜りそなの4〜9月期、純利益21%増 M&Aキャピタルと資本提携も発表", "url": "https://www.nikkei.com/article/DGXZQOUB044UF0U6A101C2000000/"}, {"name": "りそなホールディングス｜2026年11月10日付ニュースリリース", "url": "https://www.resona-gr.co.jp/holdings/news/newsrelease_c/2026/files/20261110_7t.pdf"}]}, {"id": "s4", "cat": "安全保障", "when": "11月10日", "title": "原子力潜水艦、導入視野に検討へ 安保3文書改定", "lede": "政府が年内の安保3文書改定で、原子力潜水艦の導入を視野に入れた検討を盛り込む方向で調整していると朝日新聞が報じた。", "points": ["小泉防衛相は9月、原潜保有を「あらゆる選択肢を排除せず検討する」と述べた。", "維新は6月に導入を提言。自民案は「次世代の動力の活用」と表現し、原潜とは書いていない。", "有識者会議では、人員確保の難しさなどから慎重論も出た。"], "background": "中国の海洋進出や周辺海域での活動が増え、長期間潜航できる原潜に抑止力の面で関心が集まっている。ただし巨額の費用や運用技術、人員の確保が課題とされる。", "precedents": "2021年に米英豪がAUKUSを発足させ、豪州が原潜の取得を決めた。日本は原潜を保有しておらず、その検討は異例といえる。", "history": "日本の原子力利用は1955年の原子力基本法で平和目的に限られている。原子力船「むつ」は1974年に放射線漏れを起こし、原子力の艦船利用への抵抗感は根強い。", "outlook": "改定文書で「調査・研究」にとどめるのか、より踏み込むのか、非核三原則や原子力基本法との整合がどう議論されるかが焦点となる。", "check": {"level": "partial", "note": "朝日の11月10日付報道そのものは検索で未確認。9〜10月の複数報道で政府・与野党の検討状況を確認した。"}, "sources": [{"name": "熊本日日新聞｜小泉防衛相、原潜保有を排除せず 安保3文書改定で議論", "url": "https://kumanichi.com/articles/2034875"}, {"name": "秋田魁新報｜【独自】維新、原子力潜水艦の導入提言へ", "url": "https://www.sakigake.jp/news/article/20260616CO0162/"}, {"name": "秋田魁新報｜原潜保有、有識者から慎重論 安保3文書、議事要旨公開", "url": "https://www.sakigake.jp/news/article/20260626CO0309/"}]}, {"id": "s5", "cat": "政治・経済", "when": "11月11日", "title": "小泉防衛相、総裁選不出馬の意向と報道", "lede": "小泉防衛相が次の自民党総裁選に出馬しない意向を示し、高市首相が出馬するなら「全力で支える」と語ったと報じられた。", "points": ["47NEWS、読売新聞などが11日朝に伝えた。", "小泉氏は9月にも、首相をどのような立場でも全力で支えたいと述べていた。", "前回総裁選に出た面々が次を見据えて動いているとの報道もある。"], "background": "小泉氏は2025年の総裁選で高市氏に次ぐ次点で、高市政権では防衛相を務める。不出馬は首相の再選を後押しし、党内の主導権争いを抑える意味を持つとみられる。", "precedents": "現職首相が総裁選で再選を目指す場合、有力な対抗馬が出ず無投票に近い形になる例は過去にもある。党内の支持を固める動きが先行するのが通例。", "history": "自民党総裁選は党員投票を含む方式と国会議員中心の方式があり、任期は3年である。党首選びが事実上の首相選びとなるため、政権の求心力を左右してきた。", "outlook": "首相が再選を目指すと明言するか、他に名乗りを上げる議員が出るかが注目される。", "check": {"level": "partial", "note": "11日の発言そのものは検索で確認できず、報道各社の見出しのみ。9月の「全力で支える」発言は神戸新聞で確認。"}, "sources": [{"name": "神戸新聞｜小泉防衛相が首相を全力で支える趣旨の発言", "url": "https://www.kobe-np.co.jp/news/zenkoku/compact/202609/0020787887.shtml"}, {"name": "北海道新聞｜高市総裁、小泉氏を防衛相で調整", "url": "https://www.hokkaido-np.co.jp/article/1224455/"}]}]}, {"date": "2026-11-10", "newsDate": "2026-11-09", "note": "検索の裏取りで11月9日当日の記事を十分に確認できず、全5本が一部未確認（partial）です。", "stories": [{"id": "s1", "cat": "外交", "when": "11月9日", "title": "G7外相会合がパリで開幕、ウクライナ・イランが焦点", "lede": "G7外相会合が9〜10日の日程でパリで始まった。米中間選挙後初の会合で、米国の外交方針を見極める場となる。", "points": ["ウクライナ外相を招いた別枠の会合が設けられる予定と報じられた。", "報道によれば、ウクライナ情勢とイラン情勢が主要議題。", "米国のルビオ国務長官は中間選挙後、初の国際会議に臨む。"], "background": "G7は議長国フランスの下で外相会合を重ねてきた。ロシアのウクライナ侵攻の長期化と中東情勢の緊迫で、米欧の温度差が目立つ。中間選挙の結果が米外交にどう影響するかが各国の関心事となっている。", "precedents": "2026年3月にもパリ近郊でG7外相会合が開かれ、イラン情勢やウクライナ支援をめぐり米欧の見解の違いが取り沙汰されたが、共同声明は出された。", "history": "G7は1970年代の石油危機後の経済協議を起源とし、のちに外相会合など政治・安全保障分野へ協議を広げた。1990年代にロシアが加わりG8となったが、2014年のクリミア併合で参加資格停止となった。", "outlook": "会合後に共同声明が出るか、ウクライナ支援とイランへの対応で米欧が歩み寄れるかが焦点。", "check": {"level": "partial", "note": "会合の日程・場所は確認。開幕後の議論内容は検索で確認できず、見出し候補の報道に拠る。"}, "sources": [{"name": "Eurointegration｜G7 to hold separate meeting on Ukraine with Ukrainian foreign minister in attendance", "url": "https://www.eurointegration.com.ua/eng/news/2026/11/6/7249434/index.amp"}, {"name": "Ukrainska Pravda｜G7 to hold separate meeting on Ukraine with Ukrainian foreign minister in attendance", "url": "https://www.pravda.com.ua/eng/news/2026/11/06/8061566/"}]}, {"id": "s2", "cat": "外交", "when": "11月9日", "title": "日越首脳会談、中国念頭に連携強化で一致", "lede": "高市首相はベトナム首脳と会談し、重要鉱物や経済安全保障、原子力などでの協力を進めることで一致したと報じられた。", "points": ["複数の報道は、中国を念頭に連携強化で一致したと伝えた。", "重要鉱物について首相は「協力を加速」と述べたと報じられた。", "報道によれば、原発建設への協力でも首脳が合意した。"], "background": "続報。詳しくは11月9日号。", "precedents": "日本は2026年5月にもハノイで首脳会談を行い、重要鉱物の供給網やエネルギーを新たな優先協力分野とした。", "history": "日本とベトナムは2023年に「包括的戦略的パートナーシップ」へ関係を格上げした。日本は長年ベトナム最大級の援助国で、2000年代にはベトナムの原発計画に協力したが、その計画は2016年に中止された。", "outlook": "合意が具体的な案件や資金支援にどう結びつくか、中国の反応も注目される。", "check": {"level": "partial", "note": "11月9日の会談自体は検索で確認できず、5月の会談の記録のみ確認。当日の内容は候補見出しの報道に拠る。"}, "sources": [{"name": "首相官邸｜Japan-Viet Nam Summit Meeting (Summary)", "url": "https://japan.kantei.go.jp/105/diplomatic/202605/02vietnam.html"}, {"name": "Al Jazeera｜Japan's Takaichi pledges deeper energy cooperation with Vietnam", "url": "https://www.aljazeera.com/news/2026/5/2/japans-takaichi-pledges-deeper-energy-cooperation-with-vietnam"}]}, {"id": "s3", "cat": "経済・市場", "when": "11月9日", "title": "7月30日の為替介入は7.9兆円、過去最大と公表", "lede": "財務省の公表で、政府・日銀が7月30日に行った円買い介入が7.9兆円と過去最大だったことが分かったと報じられた。", "points": ["報道によれば、円安を食い止める目的の介入だった。", "これまでの1日あたり最大は4月30日の6兆2787億円だった。", "産経は、円安の構造的要因は払拭できていないと指摘した。"], "background": "2026年は円安が進み、4月末から5月にかけても大規模な介入が行われた。日米金利差や貿易構造など、円安の背景は根深い。", "precedents": "2022年9〜10月にも政府・日銀は円買い介入を行い、当時として過去最大規模の総額となった。", "history": "日本の為替介入は1990年代から断続的に行われ、1998年の円買い介入や2011年の震災後のG7協調介入などが知られる。", "outlook": "円相場が再び急落した場合、追加介入に踏み切るか、日銀の利上げ判断との関係が注目される。", "check": {"level": "partial", "note": "7.9兆円は検索で確認できず（共同は6〜7兆円の推計）。4月30日の記録は確認。公表額は財務省の発表で要確認。"}, "sources": [{"name": "共同通信（OANDA掲載）｜為替介入、過去最大の6・2兆円", "url": "https://www.oanda.jp/lab-education/market_news/kn_2026080701000327/"}, {"name": "野村総研｜木内登英コラム（2026年8月3日）", "url": "https://www.nri.com/jp/media/column/kiuchi/20260803.html"}]}, {"id": "s4", "cat": "国際", "when": "11月9日", "title": "仏スーパー冷蔵設備攻撃、イラン関与の疑いと報道", "lede": "10月に仏スーパー約700店で冷蔵設備が乗っ取られた事件で、イラン革命防衛隊のサイバー部隊の関与を指摘する報道が出た。", "points": ["テレビ朝日系は、革命防衛隊の部隊が特定されたと伝えた。", "報道では仏外相が「相応の報い」を受けると述べたとされる。", "日本政府も冷凍・冷蔵システムへの不正アクセスに注意喚起した。"], "background": "攻撃は10月11〜12日ごろに起き、庫内温度が最高50度まで上がって食品が廃棄された。デンマーク企業の制御機器の脆弱性が指摘されている。", "precedents": "2021年には米コロニアル・パイプラインが身代金要求型ウイルスで停止し、重要インフラへのサイバー攻撃の危険が広く認識された。", "history": "2010年のスタクスネットは、制御システムへのサイバー攻撃が物理的被害をもたらし得ることを示した初期の例として知られる。", "outlook": "仏当局が公式に攻撃元を認定するか、欧州が制裁など対抗措置を取るかが焦点。", "check": {"level": "partial", "note": "攻撃の発生と規模は複数媒体で確認。イラン関与は検索で確認できず、当時は攻撃者未特定とされていた。"}, "sources": [{"name": "Al Jazeera｜Hundreds of supermarkets in France hit by 'unprecedented' cyberattack", "url": "https://aljazeera.com/news/2026/10/13/unprecedented-cyberattack-hits-french-supermarkets-causing-food-losses"}, {"name": "AP（News4JAX掲載）｜Cyberattack targeting refrigeration systems hits 700 supermarkets", "url": "https://www.news4jax.com/business/2026/10/13/cyberattack-targeting-refrigeration-systems-hits-700-supermarkets-french-government-says/"}]}, {"id": "s5", "cat": "政治", "when": "11月9日", "title": "高市首相、AI会合で国際連携を呼びかけ", "lede": "高市首相は仏政府主催のAI会合にオンラインで出席し、高性能AIの進展を受けた国際社会の連携を訴えたと報じられた。", "points": ["共同・時事・NHKが、首相が国際連携の必要性を述べたと伝えた。", "G7の一部首脳もオンラインで参加したと報じられた。", "首相の会合欠席をめぐり、国内では批判と反論が出ている。"], "background": "日本は「広島AIプロセス」を主導し、AIの国際的なルール作りに積極的な姿勢を示してきた。4月の日仏首脳会談ではAIの高官級対話の立ち上げで一致した。", "precedents": "2023年の英国AI安全サミットでは、AIの危険性に関する「ブレッチリー宣言」が採択された。", "history": "2023年のG7広島サミットで、生成AIの国際ルールを話し合う「広島AIプロセス」が始まった。", "outlook": "日仏が準備する枠組みが具体的なルールづくりに進むか、日本開催のAIサミット構想の行方が注目される。", "check": {"level": "partial", "note": "今回の会合自体は検索で確認できず。日仏のAI協力の経緯のみ官邸資料で確認。当日の内容は候補見出しの報道に拠る。"}, "sources": [{"name": "首相官邸｜日仏首脳会談（2026年4月）", "url": "https://www.kantei.go.jp/jp/105/actions/202604/01french.html"}, {"name": "首相官邸｜内閣総理大臣記者会見（2026年11月5日）", "url": "https://www.kantei.go.jp/jp/105/statement/2026/1105kaiken.html"}]}]}, {"date": "2026-11-09", "newsDate": "2026-11-08", "note": "日曜の朝刊のため動きが少ない。日越首脳会談など一部は当日の動きが未確認。", "stories": [{"id": "s1", "cat": "国際", "when": "11月8日", "title": "イラン外相「要求受理か戦争か」 米に揺さぶり", "lede": "イランのアラグチ外相が、米国に対しイランの要求を受け入れるか戦争かの選択を迫る趣旨の発言をした。米軍の対イラン海上封鎖も続く。", "points": ["共同通信系の配信で、アラグチ外相が「要求受理か、戦争か」と米国に迫ったと報じられた。", "ロイターは、米軍がオマーン湾で貨物船を航行不能にし封鎖措置を強めると伝えた。", "イランは制裁解除などを条件にホルムズ海峡を再開する用意があるとの立場を示している。"], "background": "今年2月の米・イスラエルによる対イラン攻撃以降、米国は海上封鎖を続けている。イランは凍結資産の解放や制裁解除を求め、米国は核開発の大幅な制限を求めて、双方の主張は平行線をたどる。カタールやパキスタンが仲介している。", "precedents": "2019年の米国によるイラン産原油の全面禁輸と、その後のタンカー攻撃事件でも、制裁と海上での威嚇が並行して進み、緊張が高まった。", "history": "1980年代のイラン・イラク戦争中の「タンカー戦争」以来、ホルムズ海峡は世界の原油輸送の要衝として、イランと米国の対立の舞台になってきた。", "outlook": "米中間選挙後に米国が軍事行動に出るのか、仲介による協議が続くのかが焦点となる。", "check": {"level": "partial", "note": "外相発言の原文は未確認。封鎖と交渉の経緯はAl Jazeera等の10〜11月の報道で確認。11月8日のオマーン湾の事案は未確認。"}, "sources": [{"name": "Al Jazeera｜Iran and US explore diplomacy amid rising threats of war", "url": "https://www.aljazeera.com/news/2026/11/1/iran-and-us-explore-diplomacy-amid-rising-threats-of-war"}, {"name": "Boston Globe｜Iran says it would reopen Strait of Hormuz in 2 days as part of US deal", "url": "https://www.bostonglobe.com/2026/11/02/world/iran-says-it-would-reopen-strait-hormuz-2-days-part-us-deal/"}, {"name": "Al Jazeera｜US forces disable ship attempting to run Iran blockade in Gulf of Oman", "url": "https://aljazeera.com/news/2026/10/11/us-forces-disable-ship-attempting-to-run-iran-blockade-in-gulf-of-oman"}]}, {"id": "s2", "cat": "外交", "when": "11月8日", "title": "高市首相、日朝首脳会談へ意欲 拉致被害者の集会で", "lede": "高市首相は東京での拉致被害者の帰国を求める集会で、日朝首脳会談の実現に向けて行動する考えを示した。", "points": ["読売新聞などが、首相が「私の代で突破口」と述べたと報じた。", "首相は昨年11月の集会でも、北朝鮮側に首脳会談を打診したと明らかにしていた。", "10月には、米朝会談が実現した場合の働きかけをトランプ米大統領に依頼したと報じられた。"], "background": "拉致問題は被害者家族の高齢化が進み、解決が急がれている。北朝鮮は拉致問題を「解決済み」とする立場で、これまで具体的な返答は確認されていない。", "precedents": "2002年と2004年に小泉純一郎首相が訪朝し、5人の拉致被害者とその家族が帰国した。", "history": "日朝首脳会談は2004年の小泉首相と金正日総書記の会談以来行われていない。2014年のストックホルム合意も、のちに途絶えた。", "outlook": "米朝首脳会談の行方と、北朝鮮が日本との対話に応じるかが注目される。", "check": {"level": "partial", "note": "11月8日の発言自体は検索で直接確認できず。過去の打診や10月の依頼は複数媒体で確認。"}, "sources": [{"name": "秋田魁新報｜首相「日朝首脳会談を打診した」 拉致被害者の帰国求める集会で", "url": "https://www.sakigake.jp/news/article/20251103CO0055/"}, {"name": "首相官邸｜国民大集会", "url": "https://www.kantei.go.jp/jp/104/actions/202511/03rachi.html"}, {"name": "NHK｜拉致被害者家族との面会", "url": "https://news.web.nhk/newsweb/na/nd-20261006de55168"}]}, {"id": "s3", "cat": "外交", "when": "11月9日", "title": "日越首脳会談、重要鉱物・原子力で共同声明を調整", "lede": "NHKによると、高市首相とベトナム側の首脳会談が9日に開かれ、重要鉱物や原子力での連携を盛り込む共同声明が調整されている。", "points": ["NHKは、会談で重要鉱物や原子力の連携を共同声明に盛り込む方向と伝えた。", "ベトナムの最高指導者は、日本からのさらなる投資や協力に期待を示した。", "5月のハノイでの会談では、重要鉱物の供給網での連携で一致していた。"], "background": "日本は、中国に依存する重要鉱物の調達先を広げたい。ベトナムはレアアースの資源を持ち、日本の投資と技術に期待する。", "precedents": "2023年に日越は「包括的戦略的パートナーシップ」へ関係を格上げした。", "history": "日本は1990年代からベトナムへの最大級の政府開発援助国で、経済関係を深めてきた。", "outlook": "共同声明の具体的な中身と、原子力協力の範囲が焦点となる。", "check": {"level": "partial", "note": "11月9日の会談と声明内容は、検索ではNHK報道以外に確認できず。5月の会談は外務省・首相官邸の資料で確認。"}, "sources": [{"name": "首相官邸｜日越首脳会談（5月）", "url": "https://www.kantei.go.jp/jp/105/actions/202605/02vietnam2.html"}, {"name": "秋田魁新報｜日越、重要鉱物の供給連携で一致", "url": "https://www.sakigake.jp/news/article/20260502CO0066/"}]}, {"id": "s4", "cat": "企業・市場", "when": "11月6日", "title": "KDDIとnewmoが資本業務提携 堺で自動運転タクシー", "lede": "KDDIとnewmoは、2028年に大阪府堺市で自動運転タクシーを商用化することをめざし、資本業務提携を結んだ。", "points": ["KDDIは通信、AI計算基盤、遠隔監視、高精度測位を担う。", "newmoはタクシー事業と自動運転の技術、配車アプリを担当する。", "当面は、商用運行でも安全のための運転手が同乗する見込み。"], "background": "堺市は国の自動運転の社会実装を進める事業の対象地域で、実証が進む。8月には堺市自動運転タクシー実装コンソーシアムが設立された。", "precedents": "米国ではWaymoが一部都市で自動運転タクシーを商用運行している。", "history": "日本では2023年に、運転者のいない「レベル4」の走行を認める制度が始まった。", "outlook": "堺で培った運行の仕組みを、全国の地域の交通事業者へ広げられるかが焦点となる。", "check": {"level": "ok", "note": "Impress Watch、Car Watch、堺市の資料など複数の媒体で確認。"}, "sources": [{"name": "Impress Watch｜KDDIとnewmo、自動運転タクシーで資本業務提携", "url": "https://www.watch.impress.co.jp/docs/news/2154440.html"}, {"name": "Car Watch｜KDDIとnewmoの提携", "url": "https://car.watch.impress.co.jp/docs/news/2154535.html"}, {"name": "堺市｜報道提供資料", "url": "https://www.city.sakai.lg.jp/shisei/koho/hodo/hodoteikyoshiryo/kakohodo/r8/r808/080805_02.files/0805_02.pdf"}]}, {"id": "s5", "cat": "外交", "when": "11月8日", "title": "中国で服役のアステラス社員、来月中旬に出所の見通し", "lede": "ロイターは、中国でスパイ罪により服役しているアステラス製薬の日本人社員が、来月中旬に出所し帰国する見通しだと報じた。", "points": ["男性は2023年3月に北京で拘束され、2025年7月に懲役3年6カ月の判決を受けた。", "出所・帰国の時期はロイターの報道で、検索では他媒体の確認がとれていない。", "日中関係は冷え込んでいると報じられている。"], "background": "拘束は帰国直前に起き、中国は反スパイ法違反とした。日本政府は早期の解放を繰り返し求めてきた。", "precedents": "中国では、日本人の拘束が2010年代にも相次ぎ、反スパイ法の運用が各国の企業関係者の不安を招いてきた。", "history": "反スパイ法は2014年に制定され、2023年に対象が広げられた。", "outlook": "予定どおり出所・帰国できるか、日中関係に影響が出るかが注目される。", "check": {"level": "partial", "note": "出所の見通しはロイター一報のみで、他媒体では未確認。拘束と判決の経緯は複数の報道で確認。"}, "sources": [{"name": "時事通信｜拘束のアステラス社員、初公判", "url": "https://sp.m.jiji.com/english/show/37147"}, {"name": "東洋経済オンライン｜アステラス社員の拘束", "url": "https://toyokeizai.net/articles/-/662492"}]}]}], "today": {"2026-11-12": [{"year": "1921", "label": "大正10年", "title": "ワシントン会議が開幕", "body": "1921年11月12日（現地時間）、米大統領ハーディングの呼びかけでワシントン会議が始まった。海軍軍縮条約、四か国条約、九か国条約などが結ばれ、日英同盟は終了した。", "tie": "軍拡競争は、力の均衡を制度で管理する枠組みによって抑えられることがある。", "sources": []}, {"year": "1948", "label": "昭和23年", "title": "東京裁判が判決を言い渡す", "body": "極東国際軍事裁判（東京裁判）は1948年11月12日までに、被告25人に判決を言い渡した。東條英機ら7人が絞首刑、16人が終身刑となった。判事の一部は反対意見を付した。", "tie": "戦争責任の裁きは、法の正当性と政治の現実の間で、いまも評価が分かれ続ける。", "sources": []}, {"year": "1990", "label": "平成2年", "title": "今上天皇の即位礼正殿の儀", "body": "1990年11月12日、皇居で即位礼正殿の儀が行われ、明治憲法下とは異なる日本国憲法下で初めて、天皇の即位が内外に宣明された。国費支出や政教分離を巡る議論も起きた。", "tie": "伝統儀礼を現行憲法の原則とどう両立させるかは、制度の継続に常につきまとう課題である。", "sources": []}], "2026-11-11": [{"year": "1918", "label": "大正7年", "title": "第一次世界大戦の休戦協定", "body": "1918年11月11日午前11時、コンピエーニュの森での休戦協定（署名は早朝）に基づき西部戦線の戦闘が停止した。約4年続いた戦争は終結へ向かい、翌年のヴェルサイユ条約に至る。", "tie": "戦いを止める合意と、持続する平和を築く合意は別物である。", "sources": []}, {"year": "1965", "label": "昭和40年", "title": "ローデシアが一方的独立を宣言", "body": "1965年11月11日、英領南ローデシアの白人少数派政権（スミス首相）が英国の同意なく独立を宣言した。国連は経済制裁を課し、多数派支配を求める闘争を経て1980年にジンバブエが成立した。", "tie": "少数者が多数者の権利を排した体制は、国際的孤立と内部の抵抗に長くは耐えられない。", "sources": []}, {"year": "1975", "label": "昭和50年", "title": "アンゴラが独立", "body": "1975年11月11日、アンゴラはポルトガルから独立した。しかし独立運動の諸勢力（MPLA・FNLA・UNITA）が対立し、冷戦下で米ソやキューバなどが介入する内戦が長期化した。", "tie": "独立の達成は出発点にすぎず、権力の分配に失敗すると外部の対立が国内に持ち込まれる。", "sources": []}], "2026-11-10": [{"year": "1923", "label": "大正12年", "title": "国民精神作興ニ関スル詔書", "body": "関東大震災の約2か月後の1923年11月10日、「国民精神作興ニ関スル詔書」が発せられた。復興と並んで、浮華放縦を戒め質実剛健を促す精神面の引き締めを国民に求めた内容である。", "tie": "危機の後、復興は物の再建だけでなく、社会の価値観をどう方向づけるかの問題にもなる。", "sources": []}, {"year": "1938", "label": "昭和13年", "title": "「水晶の夜」ナチスがユダヤ人を襲撃", "body": "1938年11月9日夜から10日にかけて、ドイツ全土でユダヤ人商店・シナゴーグが襲撃・放火され、多数が殺害・拘束された。ナチス政権による迫害が暴力的な段階に入った転機とされる。", "tie": "差別は制度と沈黙に支えられて段階的に激化する。早い段階での歯止めが問われる。", "sources": []}, {"year": "1989", "label": "平成元年", "title": "ブルガリアのジフコフ書記長が辞任", "body": "1989年11月10日、35年にわたり権力を握ったブルガリアのジフコフ党書記長が辞任した。ベルリンの壁開放の翌日で、東欧の共産党体制が連鎖的に崩れる流れの一つとなった。", "tie": "長期政権は盤石に見えても、周辺の変化が一気に正統性を揺るがすことがある。", "sources": []}], "2026-11-09": [{"year": "1867", "label": "慶応3年", "title": "徳川慶喜が大政奉還を上表", "body": "慶応3年10月14日（旧暦。新暦では1867年11月9日）、15代将軍徳川慶喜は政権返上を朝廷に上表した。翌日に勅許され、約260年続いた江戸幕府の統治は形式上終わった。ただし慶喜は新政権でも主導権を保つ構想で、のち戊辰戦争へ進む。", "tie": "権力の移譲は形式だけで完結しない。実質を誰が握るかを巡る争いが、その後の展開を決める。", "sources": []}, {"year": "1918", "label": "大正7年", "title": "独皇帝退位が発表されドイツ革命へ", "body": "第一次大戦の敗色濃厚な中、1918年11月9日、宰相マックス・フォン・バーデンがヴィルヘルム2世の退位を発表した。同日、シャイデマンが共和国を宣言し、帝政は崩壊。翌日に皇帝はオランダへ亡命した。", "tie": "長く続いた体制も、戦争の敗北と信頼の喪失が重なると一日で瓦解しうる。", "sources": []}, {"year": "1989", "label": "平成元年", "title": "ベルリンの壁が開放される", "body": "1989年11月9日夜、東独政府報道官シャボウスキーが旅行規制の緩和を発表。発効時期の説明が曖昧だったため市民が国境に殺到し、検問所が開放された。冷戦終結とドイツ統一（1990年）への転機となった。", "tie": "大きな歴史の転換は、不十分な伝達や偶発的な判断から一気に動くことがある。", "sources": []}]}, "builtFor": "2026-11-12"};
  var WD="日月火水木金土";
  var state={toc:[],editions:{},view:"news",date:null,open:{}};
  function $(id){return document.getElementById(id);}
  function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
  function paras(parent,text){String(text||"").split(/\n+/).forEach(function(t){if(t.trim())parent.appendChild(el("p",null,t));});}
  function parts(d){var a=d.split("-").map(Number);return{y:a[0],m:a[1],d:a[2],wd:WD[new Date(a[0],a[1]-1,a[2]).getDay()]};}
  function compact(d){return d.replace(/-/g,"");}
  function latest(){return state.toc[0]?state.toc[0].date:null;}
  function isLatest(){return !state.date||state.date===latest();}
  function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}

  (DATA&&DATA.editions||[]).forEach(function(e){
    e.today=(DATA.today&&DATA.today[e.date])||e.today||[];
    state.editions[e.date]=e;
  });
  state.toc=Object.keys(state.editions).sort().reverse().map(function(d){
    var e=state.editions[d];return{date:d,newsDate:e.newsDate,titles:(e.stories||[]).map(function(s){return s.title;})};
  });

  function parseHash(){
    var h=location.hash.slice(1);
    if(h==="archive")return{view:"archive"};
    if(h==="history")return{view:"history"};
    var m=h.match(/^(\d{4})(\d{2})(\d{2})(-history)?$/);
    if(m)return{date:m[1]+"-"+m[2]+"-"+m[3],view:m[4]?"history":"news"};
    return{view:"news"};
  }
  function hrefFor(view){
    if(view==="archive")return"#archive";
    if(isLatest())return view==="history"?"#history":"#news";
    return"#"+compact(state.date)+(view==="history"?"-history":"");
  }
  function route(){
    var r=parseHash(),pv=state.view,pd=state.date;
    state.view=r.view;state.date=r.date||latest();
    if(pv!==state.view||pd!==state.date)window.scrollTo(0,0);
    render();
  }
  function msg(title,text){var d=el("div","msg");if(title)d.appendChild(el("strong",null,title));if(text)d.appendChild(el("span",null,text));return d;}

  function renderMast(){
    var d=state.date||today(),p=parts(d),ed=state.editions[d];
    $("edDate").textContent=p.m+"月"+p.d+"日 "+p.wd+"曜日";
    var sub=$("edSub");sub.replaceChildren(el("span",null,p.y+"年（令和"+(p.y-2018)+"年）"));
    if(ed&&ed.newsDate){var n=parts(ed.newsDate);sub.appendChild(el("span",null,n.m+"月"+n.d+"日（"+n.wd+"）のニュースを収録"));}
    var stat="";
    if(ed&&ed.stories){
      var ok=ed.stories.filter(function(s){return s.check&&s.check.level==="ok";}).length,pt=ed.stories.length-ok;
      stat=ed.stories.length+"本　裏取り済み "+ok+"本"+(pt?"・一部未確認あり "+pt+"本":"");
    }
    $("edStat").textContent=stat;
    $("edBack").hidden=isLatest()||state.view==="archive";
    $("edWarn").hidden=!(DATA&&DATA.builtFor&&latest()&&latest()<DATA.builtFor&&isLatest());
  }
  function renderTabs(){
    var t=$("tabs");t.replaceChildren();
    [["news","ニュース"],["history","今日は何の日"],["archive","過去号"]].forEach(function(x){
      var a=el("a",null,x[1]);a.href=hrefFor(x[0]);
      if(state.view===x[0])a.setAttribute("aria-current","page");
      t.appendChild(a);
    });
  }
  function sources(list){
    var ul=el("ul","src");
    (list||[]).forEach(function(s){
      if(!s||!/^https?:\/\//.test(s.url||""))return;
      var li=el("li"),a=el("a",null,s.name||s.url);a.href=s.url;a.target="_blank";a.rel="noopener noreferrer";
      li.appendChild(a);ul.appendChild(li);
    });
    return ul;
  }
  function renderNews(ed){
    var f=document.createDocumentFragment();
    if(ed.note)f.appendChild(el("p","note",ed.note));
    (ed.stories||[]).forEach(function(s,i){
      var key=ed.date+"/"+(s.id||i);
      var det=el("details","story");
      if(state.open[key])det.open=true;
      det.addEventListener("toggle",function(){if(det.open)state.open[key]=1;else delete state.open[key];});
      var sum=el("summary"),meta=el("div","meta");
      meta.appendChild(el("span","cat",s.cat));
      if(s.when)meta.appendChild(el("span","when",s.when));
      var lv=s.check&&s.check.level==="ok"?"ok":"partial";
      meta.appendChild(el("span","badge "+lv,lv==="ok"?"✓ 裏取り済み":"△ 一部未確認"));
      sum.appendChild(meta);sum.appendChild(el("h2",null,s.title));sum.appendChild(el("p","lede",s.lede));sum.appendChild(el("span","toggle"));
      det.appendChild(sum);
      var b=el("div","body");
      if(s.points&&s.points.length){var ul=el("ul","points");s.points.forEach(function(p){ul.appendChild(el("li",null,p));});b.appendChild(ul);}
      [["background","背景と動機"],["precedents","似た過去の事例"],["history","関連する歴史"],["outlook","今後の注目点"]].forEach(function(x){
        if(!s[x[0]])return;b.appendChild(el("h3",null,x[1]));paras(b,s[x[0]]);
      });
      if(s.check){var c=el("div","check "+lv);c.appendChild(el("b",null,lv==="ok"?"裏取りメモ":"裏取りメモ（一部未確認）"));c.appendChild(el("span",null,s.check.note));b.appendChild(c);}
      if(s.sources&&s.sources.length){b.appendChild(el("p","src-h","出典"));b.appendChild(sources(s.sources));}
      det.appendChild(b);f.appendChild(det);
    });
    f.appendChild(el("p","foot","各記事は複数の報道を照合して作成しています。過去事例と歴史は確立した史実にもとづく解説です。"));
    return f;
  }
  function renderHistory(ed){
    var f=document.createDocumentFragment(),p=parts(ed.date);
    f.appendChild(el("h2","hist-h",p.m+"月"+p.d+"日の出来事"));
    f.appendChild(el("p","hist-sub","政治・経済・外交を中心に選んでいます。"));
    (ed.today||[]).forEach(function(t){
      var row=el("article","hist"),y=el("div","year",t.year);
      if(t.label)y.appendChild(el("small",null,t.label));
      row.appendChild(y);
      var c=el("div");c.appendChild(el("h3",null,t.title));paras(c,t.body);
      if(t.tie){var tie=el("p","tie");tie.appendChild(el("b",null,"いまに通じる視点　"));tie.appendChild(document.createTextNode(t.tie));c.appendChild(tie);}
      if(t.sources&&t.sources.length)c.appendChild(sources(t.sources));
      row.appendChild(c);f.appendChild(row);
    });
    if(!(ed.today||[]).length)f.appendChild(msg(null,"この日の「今日は何の日」はまだありません。"));
    return f;
  }
  function renderArchive(){
    var f=document.createDocumentFragment();
    state.toc.forEach(function(t,i){
      var a=el("a","arch"),p=parts(t.date);
      a.href=i===0?"#news":"#"+compact(t.date);
      if(t.date===state.date)a.setAttribute("aria-current","true");
      var d=el("div","arch-d",p.y+"年"+p.m+"月"+p.d+"日（"+p.wd+"）");
      d.appendChild(el("span",null,t.titles.length+"本"));
      a.appendChild(d);a.appendChild(el("p","arch-t",t.titles.slice(0,3).join("／")));
      f.appendChild(a);
    });
    return f;
  }
  function render(){
    renderMast();renderTabs();
    var main=$("main");main.replaceChildren();
    if(!state.toc.length){main.appendChild(msg("まだ朝刊がありません","毎朝の自動実行で作成されると、ここに表示されます。"));return;}
    if(state.view==="archive"){main.appendChild(renderArchive());return;}

  }

  var modeBtn=$("modeBtn"),mq=window.matchMedia("(prefers-color-scheme: dark)");
  function isDark(){var m=document.documentElement.getAttribute("data-mode");return m?m==="dark":mq.matches;}
  function syncMode(){modeBtn.setAttribute("aria-pressed",isDark()?"true":"false");}
  modeBtn.addEventListener("click",function(){

    try{localStorage.setItem("gyoho-mode",m);}catch(e){}

  });
  if(mq.addEventListener)mq.addEventListener("change",syncMode);

  window.addEventListener("hashchange",route);
  route();
})();
