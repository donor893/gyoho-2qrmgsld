<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8;--ink:#1B1E26;--soft:#555C6B;--faint:#868C9B;--rule:#DCDFE6;
  --ai:#22386A;--daiji:#22386A;--ai-tint:#E9EDF6;--warn:#8F5600;--warn-tint:#FBF0DD;
  --mincho:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --gothic:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111318;--ink:#E7E9EF;--soft:#A6ACBA;--faint:#777E8E;--rule:#2A2F3A;
    --ai:#93ABE8;--daiji:#2B4580;--ai-tint:#1A2132;--warn:#E3A84E;--warn-tint:#2A2216;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111318;--ink:#E7E9EF;--soft:#A6ACBA;--faint:#777E8E;--rule:#2A2F3A;
  --ai:#93ABE8;--daiji:#2B4580;--ai-tint:#1A2132;--warn:#E3A84E;--warn-tint:#2A2216;
}
:root[data-mode="light"]{
  color-scheme:light;
  --bg:#F5F6F8;--ink:#1B1E26;--soft:#555C6B;--faint:#868C9B;--rule:#DCDFE6;
  --ai:#22386A;--daiji:#22386A;--ai-tint:#E9EDF6;--warn:#8F5600;--warn-tint:#FBF0DD;
}
:root[data-mode="dark"]{
  color-scheme:dark;
  --bg:#111318;--ink:#E7E9EF;--soft:#A6ACBA;--faint:#777E8E;--rule:#2A2F3A;
  --ai:#93ABE8;--daiji:#2B4580;--ai-tint:#1A2132;--warn:#E3A84E;--warn-tint:#2A2216;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 60px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);font-size:16px;line-height:1.85;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:20px;padding-right:20px}
a{color:var(--ai);text-underline-offset:3px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--ai);outline-offset:3px;border-radius:2px}
p{margin:0 0 .9em}

.mast{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding-top:26px;padding-bottom:22px}
.daiji{font-family:var(--mincho);font-weight:800;font-size:40px;line-height:1.08;background:var(--daiji);color:var(--daiji-ink,#fff);padding:12px 10px;border-radius:2px;margin:0;text-align:center}
.daiji span{display:block}
.ed-date{font-family:var(--mincho);font-weight:800;font-size:clamp(30px,8vw,42px);line-height:1.15;margin:2px 0 6px;letter-spacing:.02em}
.ed-sub{color:var(--soft);font-size:14px;margin:0 0 4px;line-height:1.6}
.ed-sub span{display:block}
.ed-stat{font-size:13px;color:var(--soft);margin:0;line-height:1.6}
.ed-back{font-size:13px;margin:6px 0 0}
.ed-warn{font-size:13px;margin:6px 0 0;color:var(--warn)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
.tabs .wrap{display:flex;align-items:center;gap:8px}
.tab-links{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;min-width:0}
.mode-btn{flex:0 0 auto;font:inherit;font-size:13px;font-weight:600;line-height:1.6;color:var(--soft);background:none;border:1px solid var(--rule);border-radius:999px;padding:3px 12px;cursor:pointer}
.mode-btn[aria-pressed="true"]{color:var(--bg);background:var(--ink);border-color:var(--ink)}
.mode-btn:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.tabs a{flex:0 0 auto;padding:12px 14px 11px;color:var(--soft);text-decoration:none;font-size:15px;font-weight:600}
.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ai)}

main{padding:6px 0 64px}
.note{font-size:13.5px;color:var(--soft);margin:18px 0 4px}
.msg{padding:48px 0;color:var(--soft)}
.msg strong{display:block;color:var(--ink);font-family:var(--mincho);font-size:20px;margin-bottom:8px}

.story{border-bottom:1px solid var(--rule)}
.story summary{list-style:none;cursor:pointer;padding:22px 0 20px}
.story summary::-webkit-details-marker{display:none}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:13px}
.cat{color:var(--ai);font-weight:700}
.when{color:var(--faint)}
.badge{font-weight:600}
.badge.ok{color:var(--ai)}
.badge.partial{color:var(--warn)}
.story h2{font-family:var(--mincho);font-weight:600;font-size:21px;line-height:1.5;margin:6px 0 8px}
.lede{color:var(--soft);font-size:15px;margin:0}
.toggle{display:inline-block;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--ai)}
.toggle::after{content:"解説を読む ＋"}
.story[open] .toggle::after{content:"閉じる −"}
.body{padding:0 0 30px}
.points{list-style:none;margin:0;padding:14px 16px;background:var(--ai-tint);border-radius:6px}
.points li{position:relative;padding-left:1.1em;font-size:15px;line-height:1.75}
.points li+li{margin-top:8px}
.points li::before{content:"";position:absolute;left:0;top:.72em;width:.42em;height:.42em;background:var(--ai);border-radius:50%}
.body h3{font-family:var(--mincho);font-weight:600;font-size:17.5px;margin:28px 0 8px;line-height:1.4}
.check{margin-top:28px;padding:12px 16px;border-left:3px solid var(--ai);background:var(--ai-tint);font-size:14px;line-height:1.75}
.check.partial{border-color:var(--warn);background:var(--warn-tint)}
.check b{display:block;margin-bottom:2px}
.src{margin:18px 0 0;padding:0;list-style:none;font-size:13.5px;line-height:1.6}
.src li{margin:0 0 8px}
.src-h{font-size:13px;color:var(--faint);margin:20px 0 6px;font-weight:600}

.hist-h{font-family:var(--mincho);font-weight:800;font-size:26px;margin:24px 0 4px}
.hist-sub{color:var(--soft);font-size:14px;margin:0 0 8px}
.hist{display:grid;grid-template-columns:76px 1fr;gap:4px 16px;padding:24px 0;border-bottom:1px solid var(--rule)}
.year{font-family:var(--mincho);font-weight:800;font-size:28px;line-height:1.1;color:var(--ai)}
.year small{display:block;font-family:var(--gothic);font-weight:500;font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.4}
.hist h3{font-family:var(--mincho);font-weight:600;font-size:19px;line-height:1.5;margin:0 0 8px}
.tie{margin:6px 0 0;padding:10px 14px;background:var(--ai-tint);border-radius:6px;font-size:14px;line-height:1.75}
.tie b{color:var(--ai)}
.hist .src{margin-top:12px}

.arch{display:block;padding:18px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.arch-d{font-family:var(--mincho);font-weight:600;font-size:20px}
.arch-d span{font-family:var(--gothic);font-size:13px;color:var(--faint);font-weight:500;margin-left:10px}
.arch-t{margin:4px 0 0;color:var(--soft);font-size:14px;line-height:1.65}
.arch[aria-current="true"] .arch-d::after{content:"表示中";font-family:var(--gothic);font-size:12px;font-weight:600;color:var(--ai);margin-left:10px}
.foot{color:var(--faint);font-size:12.5px;margin-top:36px;line-height:1.7}

@media (max-width:420px){
  .wrap{padding-left:16px;padding-right:16px}
  .daiji{font-size:34px;padding:10px 8px}
  .hist{grid-template-columns:1fr}
  .year{font-size:24px}
  .year small{display:inline;margin-left:8px}
}
</style>
</head>

"記者の解放につながるか、対話が制裁方針に影響するかが注目点となる。", "check": {"level": "partial", "note": "記者拘束と対話実現の観測は確認。30分の対話そのものは検索で直接確認できず、候補見出し（朝日・時事ほか）に依拠。"}, "sources": [{"name": "nippon.com｜Takaichi Denies Japan's Espionage Activities in Russia", "url": "https://www.nippon.com/en/news/yjj2026101500520/"}, {"name": "The Star｜Japan demands release of journalist arrested in Russian Far East", "url": "https://www.thestar.com.my/aseanplus/aseanplus-news/2026/10/21/japan-demands-release-of-journalist-arrested-in-russian-far-east"}, {"name": "NHK｜官房長官会見（APEC会期中の日ロ首脳対話について）", "url": "https://news.web.nhk/newsweb/na/nd-20261113de75620"}]}, {"id": "s3", "cat": "国際", "when": "11月19日", "title": "米国防長官がベネズエラ訪問と報道", "lede": "共同通信などは、米国防長官がマドゥロ大統領拘束後で初めてベネズエラを訪れ、軍事関係の再構築で合意したと伝えた。", "points": ["報道では、両国は軍事関係を立て直すことで一致したとされる。", "拘束後の米軍高官の訪問は、すでに6月に統合参謀本部議長が行ったと報じられている。", "米国とベネズエラは3月に関係を回復したと伝えられている。"], "background": "米軍がマドゥロ氏を拘束した後、ベネズエラでは暫定政権が発足した。米国は麻薬対策や移民問題での協力を軸に関係を作り直している。", "precedents": "米国は1989年にパナマのノリエガ将軍を拘束した後、新政権と軍の再編を進めた。", "history": "米国はカリブ海・中南米で冷戦期から軍事介入を重ねてきた。ベネズエラとの関係は、チャベス政権以来約20年にわたり対立が続いた。", "outlook": "合意の具体的な中身と、暫定政権の正統性や選挙日程が焦点となる。", "check": {"level": "partial", "note": "長官の訪問と合意は検索で裏付けられず、候補見出し（共同・テレ朝）のみ。統合参謀本部議長の訪問は報道あり。"}, "sources": [{"name": "SCMP｜Top US commander makes surprise visit to Venezuela weeks after Maduro capture", "url": "https://www.scmp.com/news/world/americas/article/3343955/top-us-commander-makes-surprise-visit-venezuela-weeks-after-maduro-capture"}, {"name": "Baird Maritime｜US general's surprise Venezuela visit tackles drugs, illegal migration and security", "url": "https://www.bairdmaritime.com/amp/story/security/incidents/piracy/us-generals-surprise-venezuela-visit-tackles-drugs-illegal-migration-and-security"}]}, {"id": "s4", "cat": "政治・経済", "when": "11月19日", "title": "EV新税、2028年5月導入で政府与党が調整", "lede": "政府・与党は、電気自動車（EV）への新たな課税を2028年5月に導入する方向で調整に入ったと報じられた。車の重さに応じて税額を加算する。", "points": ["対象は2028年5月1日以降に車検を受けるEVとPHEVとされる。", "政府・与党は、パワートレイン間の税負担の公平性を理由に挙げている。", "具体的な税額は未定で、PHEVはEVの半分程度とする案も報じられた。"], "background": "EVはガソリン税を負担せず、電池の分だけ車体が重く道路への負荷も大きい。普及で燃料課税による道路財源が細る懸念がある。", "precedents": "英国は2028年4月から、走行距離に応じたEV課税を始める方針を決めている。", "history": "日本ではエコカー減税などでEVを税制面で優遇してきた。自動車重量税も、EVは最長5年間非課税だった。", "outlook": "年末の税制改正大綱で、税額と対象の線引きがどう決まるかが焦点となる。", "check": {"level": "partial", "note": "2028年5月の加算方針は複数媒体で確認。19日付の調整報道そのものと税額は未確認。"}, "sources": [{"name": "ベストカーWeb｜2028年からのEV重量税特例加算について影響を試算する", "url": "https://bestcarweb.jp/feature/column/1626564"}, {"name": "Motor-Fan｜EV課税をめぐる税制改正の動き", "url": "https://motor-fan.jp/article/1352344/"}, {"name": "Just Auto｜Japan plans new tax on EVs", "url": "https://www.just-auto.com/newsletters/japan-plans-new-tax-on-evs"}]}, {"id": "s5", "cat": "企業・市場", "when": "11月18日", "title": "独、買収ルール厳格化へ　安値提案を抑制", "lede": "ドイツ政府が、低い価格での買収提案を抑え、株主保護を強める方向で買収ルールの見直しを進めているとロイターが伝えた。", "points": ["連立は2026年中に法案を提出し、連邦議会の議決は2027年前半になりうるとされる。", "財務省は、コメルツ銀行をめぐるユニクレディトの動きのような事例を防ぐ方向で議論している。", "現行法は、低すぎる価格から個々の株主を守る最低価格規則を持つ。"], "background": "コメルツ銀行のワイドマン監査役会議長は、ユニクレディトが十分なプレミアムなしに支配権を得たとして、ルール見直しを求めていた。", "precedents": "2000年の欧州議会での買収指令否決後も、EUでは買収防衛や少数株主保護の調整が続いてきた。", "history": "ドイツは2002年に証券取得・企業買収法（WpÜG）を制定し、少数株主を守る枠組みを作った。2000年のボーダフォンによるマンネスマン買収が契機の一つになった。", "outlook": "法案の具体的な内容と、外国企業による銀行買収への影響が注目点となる。", "check": {"level": "partial", "note": "見直しの議論は独紙で確認。ロイター18日付の原記事と法案の最終内容は未確認。"}, "sources": [{"name": "Börsen-Zeitung｜Insider: Finanzministerium diskutiert schärfere Übernahmeregeln", "url": "https://www.boersen-zeitung.de/konjunktur-politik/insider-finanzministerium-diskutiert-schaerfere-uebernahmeregeln"}, {"name": "cash.ch｜Wie neue Regeln in Deutschland Aktionäre vor Billig-Übernahmen schützen könnten", "url": "https://www.cash.ch/news/top-news/wie-neue-regeln-in-deutschland-aktionare-vor-billig-ubernahmen-schutzen-konnten-973924"}, {"name": "Euronext｜Commerzbank chair calls for review of German takeover rules after UniCredit bid", "url": "https://live.euronext.com/en/financial-news/commerzbank-chair-calls-review-german-takeover-rules-after-unicredit-bid"}]}]}, {"date": "2026-11-18", "newsDate": "2026-11-17", "note": "検索で当日の報道を直接確認できた項目が少なく、多くが一部未確認です。", "stories": [{"id": "s1", "cat": "国際", "when": "11月18日", "title": "APEC開幕、史上初の米中ロ首脳会談へ", "lede": "中国・深センでAPEC首脳会議が開幕する。会期中に米中ロ3首脳の会談が予定され、プーチン氏も到着したと伝えられた。", "points": ["プーチン氏が深センに到着したと、ロイターやTBSなどが報じた。", "米中ロ首脳の3者会談は史上初で、事前にホワイトハウスも計画を認めていた。", "高市首相も現地入りし、トランプ氏と短時間懇談したと報じられた。"], "background": "前号で扱った米中ロ首脳会談の続報。詳しくは11月17日号。核軍縮などが主な議題になる見通しと事前に報じられている。", "precedents": "", "history": "", "outlook": "3首脳が核軍縮で具体的な合意に至るか、会談後に共同文書が出るかが焦点になる。", "check": {"level": "partial", "note": "会談の事前計画は英語報道で確認。プーチン氏到着や日米懇談は候補見出しのみで、検索では未確認。"}, "sources": [{"name": "Al Jazeera｜Trump-Xi-Putin trilateral meeting at APEC: What to expect", "url": "https://aljazeera.com/news/2026/11/14/trump-xi-putin-trilateral-meeting-at-apec-what-to-expect"}, {"name": "Fox5｜Trump, Xi and Putin plan an unprecedented joint meeting, White House says", "url": "https://www.fox5vegas.com/2026/11/14/trump-xi-putin-plan-an-unprecedented-joint-meeting-white-house-says/"}]}, {"id": "s2", "cat": "安全保障", "when": "11月18日", "title": "装備輸出ルール改定案、非核三原則の前文削除か", "lede": "防衛装備品の輸出ルールの改定案から、非核三原則に触れた前文が削除される方向だと共同通信などが報じた。", "points": ["共同通信の独自報道として、47NEWSなどが伝えた。", "西日本新聞は、理念の変容を懸念する見方があると報じた。", "政府が公式に認めたかは、確認できていない。"], "background": "政府は2026年4月、防衛装備移転三原則と運用指針を改定し、輸出を5類型に限る制限を撤廃した。今回はその運用ルールをさらに見直す動きとみられる。", "precedents": "", "history": "非核三原則は「持たず、作らず、持ち込ませず」の方針で、1960年代後半に佐藤栄作首相が表明した。", "outlook": "改定案が正式決定されるか、与野党や被爆者団体がどう反応するかが注目される。", "check": {"level": "partial", "note": "前文削除の報道は候補見出しのみ。検索では確認できず、2026年4月の改定の事実のみ確認。"}, "sources": [{"name": "nippon.com｜Japan Lifts Weapon Export Ban in Principle", "url": "https://www.nippon.com/en/news/yjj2026042100303/"}, {"name": "内閣官房｜防衛装備移転三原則運用指針（令和8年4月21日）", "url": "https://www.cas.go.jp/jp/gaiyou/jimu/pdf/r80421_bouei2.pdf"}]}, {"id": "s3", "cat": "外交", "when": "11月17日", "title": "日米豪印首脳が2年ぶり会合、威圧に懸念", "lede": "日米豪印の首脳が約2年ぶりに会合を開き、輸出規制を含む経済的威圧に深刻な懸念を示したと報じられた。", "points": ["読売新聞は、中国を名指しせず牽制したと報じた。", "テレビ朝日は、現状変更の試みに反対することを確認したと伝えた。", "会合の場所や声明の全文は、今回は確認できていない。"], "background": "10月末のQuad外相会合でも、経済的威圧や過剰生産への懸念が示されていた。首脳会合はマニラで開かれる見通しと事前に報じられていた。", "precedents": "", "history": "Quadは2007年に日本の安倍晋三首相らが構想し、2017年に局長級協議が再開、2021年に首脳会合が始まった。", "outlook": "米国の対中姿勢が定まるかと、米中ロ会談後に4か国の連携がどう動くかが注目される。", "check": {"level": "partial", "note": "会合開催は国内2媒体の見出しのみ。検索では事前報道と外相会合しか確認できず。"}, "sources": [{"name": "political.org｜Trump, Modi, Takaichi and Albanese expected to hold Quad leaders summit in Manila", "url": "https://political.org/2026/11/13/trump-modi-takaichi-and-albanese-expected-to-hold-first-quad-leaders-summit-in-two-years-in-manila-on-tuesday-november-17/"}, {"name": "China Global South｜Quad Ministers Express ‘Grave Concerns’ Over Economic Coercion", "url": "https://chinaglobalsouth.com/2026/11/01/quad-china-economic-coercion-export-curbs-overcapacity/"}]}, {"id": "s4", "cat": "外交", "when": "11月17日", "title": "日韓首脳会談、李大統領が来年1月来日へ", "lede": "高市首相と韓国の李在明大統領が会談し、李氏が来年1月に日本を訪れる方向で調整することになったと報じられた。", "points": ["日本経済新聞は、李氏を来年1月に招待したと報じた。", "読売新聞は、シャトル外交の一環と伝えた。", "日程や訪問先の詳細は、確認できていない。"], "background": "両首脳は2026年1月に奈良で、5月に韓国・安東で会談し、相互訪問を続けてきた。", "precedents": "", "history": "日韓のシャトル外交は2000年代に始まり、首脳が相互に訪問する枠組みとして、中断を挟みつつ続いてきた。", "outlook": "中国との関係が冷え込むなか、日韓がどこまで協力を深められるかが注目される。", "check": {"level": "partial", "note": "来年1月の来日は候補見出しのみ。検索では2026年1月と5月の会談を外務省等で確認。"}, "sources": [{"name": "外務省｜日韓首脳会談（安東）", "url": "https://www.mofa.go.jp/mofaj/a_o/na/kr/pageit_000001_02969.html"}, {"name": "首相官邸｜日韓首脳共同発表（2026年1月13日）", "url": "https://www.kantei.go.jp/jp/104/statement/2026/0113kyoudou_happyou.html"}]}, {"id": "s5", "cat": "企業・市場", "when": "11月17日", "title": "MUFG、新たにAI開発企業との提携を発表", "lede": "MUFGが新たなAI開発企業との提携を発表し、金融サービスへの活用を目指すと報じられた。", "points": ["琉球朝日放送とテレビ朝日が報じた。", "提携先の名称や内容は、今回の確認では特定できなかった。", "同社は2025年にOpenAI、2026年5月にGoogleと協業を発表している。"], "background": "MUFGはAI活用を経営の柱と位置づけ、行内利用や個人向けアプリへの組み込みを進めている。", "precedents": "2025年11月には三菱UFJ銀行がOpenAIとの戦略的契約を発表し、行員へのChatGPT Enterprise導入を進めた。", "history": "", "outlook": "提携が顧客向けサービスにいつ反映されるかが注目される。", "check": {"level": "partial", "note": "今回の提携の相手と内容は未確認。過去の提携のみ検索で確認。"}, "sources": [{"name": "三菱UFJ銀行｜ニュースリリース（2025年11月17日）", "url": "https://www.bk.mufg.jp/news/news2025/pdf/news1117.pdf"}, {"name": "MUFG｜Googleとの提携発表（2026年5月7日）", "url": "https://www.mufg.jp/dam/pressrelease/2026/pdf/news-20260507-001_ja.pdf"}]}]}, {"date": "2026-11-17", "newsDate": "2026-11-16", "note": "検索で当日の細部を十分に裏取りできなかったため、全記事を「一部未確認」としています。", "stories": [{"id": "s1", "cat": "国際", "when": "11月17日", "title": "米中ロ首脳会談、共同文書発表の見通し", "lede": "19日に予定される初の米中ロ首脳会談で、共同コミュニケが出る見込みと報じられた。ロシア側は協議が集中的に進んでいると説明している。", "points": ["共同通信などは、ロシアが共同コミュニケ発表の見込みと伝えた。", "ロシア大統領補佐官は、共同声明を巡る協議が集中的に続くと述べた。", "中国外務省は会談を「画期的意義」があるとして評価した。"], "background": "詳しくは11月16日号。トランプ氏は10月、核兵器や非核化を主な議題とする3カ国会談に意欲を示したと報じられていた。会場は中国のAPEC首脳会議に合わせた形が想定されている。", "precedents": "大国間の首脳が核軍縮を扱った例には、冷戦期の米ソ首脳会談がある。ただし3カ国が同席する会談は前例がなく、比較は難しい。", "history": "1945年のヤルタ会談は、米英ソの首脳が戦後秩序を話し合った会議として知られる。今回「新ヤルタ」への懸念が出るのは、大国だけで秩序を決めるのではという警戒による。", "outlook": "共同文書に核軍縮やAIと核指揮統制がどう盛り込まれるか、日本への言及があるかが注目点となる。", "check": {"level": "partial", "note": "検索では10月の準備状況までしか確認できず、共同文書の見通し自体は候補記事の見出しに基づく。"}, "sources": [{"name": "熊本日日新聞｜米中ロ首脳会談へ「中国が準備」 ロシア大統領補佐官", "url": "https://kumanichi.com/articles/2049264"}, {"name": "琉球新報（共同）｜米中ロ首脳会談関連", "url": "https://ryukyushimpo.jp/kyodo/entry-1769249.html"}]}, {"id": "s2", "cat": "外交", "when": "11月17日", "title": "高市首相、ASEANで石油調達の新枠組み提唱へ", "lede": "高市首相はASEAN関連首脳会議で、アジアの石油調達に関する新たな枠組みを提唱する方針と報じられた。石油備蓄などの支援も表明する見通しだ。", "points": ["共同通信は、首相が石油調達の新枠組みを提唱すると伝えた。", "毎日新聞は、石油備蓄などの支援表明を中国を念頭にした存在感の発揮と報じた。", "首相は16日にマニラ入りし、フィリピン大統領と会談した。"], "background": "4月に首相は約100億ドルの金融協力と「パワー・アジア」構想を打ち出した。中東情勢の悪化でアジア各国が石油調達に不安を抱えていることが背景にある。", "precedents": "日本は過去にもアジア向けに、金融協力や備蓄制度の整備で支援してきた。今回はその延長にある取り組みとみられる。", "history": "日本とASEANはエネルギー分野で長く協力してきた。1970年代の石油危機は、日本が供給網の多様化を重視する契機になった。", "outlook": "新枠組みの規模や参加国、中国の反応、今週のAPECでの日中接触の有無が焦点となる。", "check": {"level": "partial", "note": "11月の新枠組みの詳細は検索で確認できなかった。4月の構想は複数媒体で確認済み。"}, "sources": [{"name": "The Star｜Japan PM pledges US$10bil in financial aid to Asia to tackle oil shortage", "url": "https://www.thestar.com.my/aseanplus/aseanplus-news/2026/04/15/japan-pm-pledges-us10bil-in-financial-aid-to-asia-to-tackle-oil-shortage"}, {"name": "TBS News｜Japan announces $10b fund to help Southeast Asia tackle oil price spike", "url": "https://www.tbsnews.net/world/japan-announces-10b-fund-help-southeast-asia-tackle-oil-price-spike-1412201"}]}, {"id": "s3", "cat": "政治・安全保障", "when": "11月17日", "title": "安保3文書改定、有事の備えを社会全体に", "lede": "政府は安保3文書の年内改定に向け、有事に社会全体で備える方針を示したと報じられた。防衛財源を巡る議論も進む。", "points": ["朝日新聞は、協力企業への補償の検討を含む方針と報じた。", "政府は今月末から安保政策の広報を拡充する方針と伝えられた。", "有識者は防衛財源の確保を要請し、増税への言及もあったと報じられた。"], "background": "2022年に改定された3文書は、防衛費を大幅に増やす方針を示した。今回は長期戦を見据えた持続的な対応能力や、新しい戦い方が柱になる見通しだ。", "precedents": "有事の民間協力の枠組みは、2000年代の有事法制や国民保護法で整えられてきた。今回はそれを企業活動にまで広げる動きと言える。", "history": "戦時中の総動員体制への反省から、戦後日本は民間の動員に慎重だった。識者が「総力戦体制の現代版か」と指摘するのはこのためである。", "outlook": "与党協議と有識者会議の報告書の内容、防衛費の財源をどうするかが焦点となる。", "check": {"level": "partial", "note": "広報拡充は確認できたが、協力企業への補償や社会全体の備えは検索で未確認。"}, "sources": [{"name": "熊本日日新聞（共同）｜安保3文書改定へ広報拡充 政府、年齢層で媒体区別", "url": "https://kumanichi.com/articles/2050164"}, {"name": "北海道新聞｜自民の安保3文書提言 「有事」色濃く", "url": "https://www.hokkaido-np.co.jp/article/1322912/"}]}, {"id": "s4", "cat": "国際", "when": "11月16日", "title": "フーシ派、要衝の海峡掌握を主張", "lede": "イエメンの親イラン武装組織フーシ派が、紅海の出入り口にあたるバブエルマンデブ海峡の掌握を「達成」したと主張した。政府側は撤退したと報じられた。", "points": ["共同通信は、フーシ派が海峡の掌握を主張したと伝えた。", "テレビ朝日系は、政府側が海峡地域から撤退したと報じた。", "9月にも、フーシ派は港町モカやペリム島を押さえたと報じられていた。"], "background": "9月、フーシ派は沿岸の港町や島々を次々に押さえた。政府側はサウジ支援を受けて反攻を試みたが、戦況は流動的だった。ホルムズ海峡の混乱で、この海峡の重要性も高まっている。", "precedents": "フーシ派は2023年以降、紅海で商船を攻撃し、多くの船が航路を変えた。海峡周辺の支配が強まれば、同様の懸念が再燃しうる。", "history": "バブエルマンデブ海峡は紅海とアデン湾を結び、スエズ運河経由の航路の要である。イエメン内戦は2014年に本格化した。", "outlook": "海運や原油輸送への影響、サウジやイランの出方、国連などによる仲介の動きが注目点となる。", "check": {"level": "partial", "note": "9月の経緯は複数媒体で確認した。11月の撤退・掌握の主張は検索で確認できていない。"}, "sources": [{"name": "Euronews｜Houthis seize Yemeni island in Bab el-Mandeb", "url": "https://www.euronews.com/2026/09/11/houthis-seize-yemeni-island-in-bab-el-mandeb-taking-control-of-the-strait"}, {"name": "Al Jazeera｜Yemen's Houthis seize strategic Red Sea city of Mocha", "url": "https://www.aljazeera.com/news/2026/9/10/yemens-houthis-seize-strategic-red-sea-city-of-mocha"}]}, {"id": "s5", "cat": "企業・市場", "when": "11月16日", "title": "出光、KeePer技研と資本業務提携", "lede": "出光興産がKeePer技研と資本業務提携し、VTホールディングスから全株を譲り受けると、ロイターなどが報じた。", "points": ["ロイターは、出光がVTから株式の全てを譲り受けると伝えた。", "両社は2024年から、洗車・コーティング専門店の展開で提携している。", "当時の目標は、2030年までに150店舗とされていた。"], "background": "出光はガソリン需要の縮小を見据え、給油所の跡地や敷地を活用した事業を探ってきた。KeePer技研は車のコーティングを手がける。VTは2019年に同社と資本業務提携した。", "precedents": "石油元売りが給油所網を生かし、洗車や車関連サービスへ広げる動きは他社にもある。", "history": "日本の給油所数は1990年代半ばをピークに減少してきた。元売り各社は、燃料販売に頼らない収益源を模索している。", "outlook": "出資比率や取得額、店舗展開の加速につながるかが注目される。", "check": {"level": "partial", "note": "今回の提携の詳細は検索で確認できず、見出し報道に基づく。2024年の提携は出光の発表で確認した。"}, "sources": [{"name": "出光興産｜KeePer技研との戦略的業務提携（2024年8月9日）", "url": "https://www.idemitsu.com/jp/news/2024/240809_1.pdf"}, {"name": "日本M&Aセンター｜VTHDとKeePer技研の資本業務提携", "url": "https://www.nihon-ma.co.jp/news/20190920_7593-10/"}]}]}, {"date": "2026-11-16", "newsDate": "2026-11-15", "note": "日曜で動きが少ない日。ASEAN首脳会議の結果など一部は検索で確認できず、partialとした。", "stories": [{"id": "s1", "cat": "国際", "when": "11月15日", "title": "米中ロ首脳会談、19日開催へ 日本は「新ヤルタ」懸念", "lede": "トランプ米大統領が中国で習近平主席、プーチン大統領と会う初の米中ロ3首脳会談が19日に調整され、高市首相の外交は逆風となる。", "points": ["国内各紙は、会談を19日実施と報じた。ウクライナでの戦闘終結は議題に上らない見通し。", "トランプ氏は8日、核軍縮・非核化を話し合う意向を記者団に示したと報じられている。", "日経は、米中ロの接近で日本が取り残される「新ヤルタ」懸念が出ていると伝えた。"], "background": "詳しくは11月15日号。APEC首脳会議は18〜19日に中国・深センで開かれ、その場で3首脳が会う構想が先行していた。", "precedents": "1945年のヤルタ会談は米英ソ3首脳が戦後秩序を決めた会合で、当事国抜きで大国が頭越しに決める例として今も引き合いに出される。", "history": "米ソ・米中は冷戦期から首脳級の接触を重ねてきたが、米中ロの3者が一堂に会する首脳会談は、報道によれば今回が初めてとされる。", "outlook": "19日の会談で核軍縮が実際に議題となるか、日本や同盟国への説明がどうなるかが焦点。", "check": {"level": "partial", "note": "19日開催は国内報道で確認したが、検索では開催確定を示す記事が見つからず、議題と出席は未確認。"}, "sources": [{"name": "熊本日日新聞｜米中ロ首脳会談開催へ意欲 トランプ大統領、調整難航も", "url": "https://kumanichi.com/articles/2048398"}, {"name": "Al Jazeera｜What a Trump-Xi-Putin summit would mean – and what it wouldn’t", "url": "https://www.aljazeera.com/amp/news/2026/11/6/what-a-trump-xi-putin-summit-would-mean-and-what-it-wouldnt"}, {"name": "SCMP｜What one big thing could stop Xi, Putin and Trump meeting at APEC", "url": "https://www.scmp.com/news/china/diplomacy/article/3373292/what-one-big-thing-could-stop-xi-putin-and-trump-meeting-apec"}]}, {"id": "s2", "cat": "外交", "when": "11月15日", "title": "ASEAN首脳会議開幕 南シナ海の行動規範は年内妥結せず", "lede": "マニラでASEAN関連首脳会議が開幕した。国内各紙はミャンマー復帰の見送りと、南シナ海の行動規範の年内妥結断念を報じた。", "points": ["日経・読売は、中国との行動規範が年内に成立しない見通しと伝えた。比外相は「8割合意」と説明した。", "朝日・毎日・東京は、ミャンマーの首脳級復帰の判断を見送ったと報じた。", "高市首相は16日に現地入りし、その後は中国へ向かう予定と報じられている。"], "background": "詳しくは11月15日号。ミャンマー問題は議長国フィリピンの下でも決着していない。", "precedents": "行動規範は2002年の宣言以降、協議が続く。2018年に草案の一本化、その後も期限の更新が繰り返されてきた。", "history": "ミャンマーは2021年のクーデター後、首脳級の会議出席を認められていない。ASEANは同年「5項目合意」を作ったが、履行は進んでいない。", "outlook": "ミャンマーへの接触継続の中身と、行動規範の新たな目標時期をどう示すかが注目点。", "check": {"level": "partial", "note": "行動規範の年内断念は11月12日付の外電で確認。ミャンマー復帰見送りの結果は検索で確認できず、国内報道のみ。"}, "sources": [{"name": "Bernama｜CoC On South China Sea Expected To Be Finalised At 49th ASEAN Summit In November", "url": "https://asean.bernama.com/news.php?id=2584306"}, {"name": "Fulcrum｜ASEAN's convening power meets its delivery test", "url": "https://fulcrum.sg/article/aseanfocus/aseans-convening-power-meets-its-delivery-test-lessons-from-the-59th-asean-foreign-ministers-meeting/"}]}, {"id": "s3", "cat": "外交", "when": "11月15日", "title": "日中首脳会談、実現は不透明 世論は改善に悲観的", "lede": "高市首相の訪中を前に、日中首脳会談の調整が不調だと報じられた。朝日の世論調査では、関係改善に「期待できない」が大幅に増えた。", "points": ["山陽新聞（共同系とみられる）は、中国が会談を拒否し調整が不調だと独自に報じた。", "朝日の世論調査は、日中改善に「期待できない」が67%に増えたと伝えた。", "関係悪化の背景には、台湾有事を巡る首相の国会答弁がある。"], "background": "昨年11月、首相が台湾有事は存立危機事態になり得ると国会で述べたことを契機に、日中関係は冷え込んだ。", "precedents": "2012年の尖閣国有化後も首脳会談は約2年途絶え、2014年のAPECで安倍首相と習主席が会うまで続いた。", "history": "日中は1972年の国交正常化以来、歴史や領土を巡る摩擦のたびに首脳対話の再開で関係を立て直してきた。", "outlook": "APEC期間中に首脳が言葉を交わすか、中国側が会談の条件に何を求めるかが焦点。", "check": {"level": "partial", "note": "会談不調と世論調査の数字は候補見出しのみで、検索では2社目の裏付けが取れなかった。"}, "sources": [{"name": "NHK｜世論調査（高市政権の対中姿勢評価）", "url": "https://news.web.nhk/newsweb/na/nd-20261109de72732"}, {"name": "ニッポンドットコム｜高市内閣の支持率", "url": "https://www.nippon.com/ja/japan-data/h30019/"}]}, {"id": "s4", "cat": "企業・市場", "when": "11月15日", "title": "アンソロピック上場、19日初取引へ 市場の審判", "lede": "米AI企業アンソロピックがナスダックに上場する見通し。報道によれば18日に価格が決まり、19日に取引が始まる。", "points": ["10日提出の改定届出書は、825百万株を1株70〜78ドルで売り出すとされる。", "調達額は約610億〜640億ドルとの報道。評価額は1.2兆〜1.4兆ドル規模と伝わる。", "NVIDIAやアルファベットなどが投資に加わると報じられている。"], "background": "詳しくは各紙の報道が必要だが、AI株が急落するなか、巨額の資金調達が成立するかが試されている。", "precedents": "2012年のフェイスブック上場は当時の大型案件で、初日の値動きが市場心理を左右した。", "history": "米国では2000年前後のITバブル崩壊の際、期待先行で上場した企業の株価が大きく崩れた歴史がある。", "outlook": "公開価格が想定レンジに収まるか、初日の値動きがAI関連株全体に波及するかが注目点。", "check": {"level": "partial", "note": "価格決定18日・取引開始19日は報道ベースで未確定。金額は媒体で差があり、確定値ではない。"}, "sources": [{"name": "RTTNews｜Anthropic sets IPO price range at $70-$78 per share", "url": "https://www.rttnews.com/3712632/anthropic-sets-ipo-price-range-at-70-78-per-share-launches-roadshow.aspx?type=ipo"}, {"name": "The Next Web｜Anthropic's IPO seeks up to $64.4B at a $1.4 trillion valuation", "url": "https://thenextweb.com/news/anthropic-ipo-terms-1-4-trillion-valuation"}, {"name": "Renaissance Capital｜Anthropic sets terms for $61 billion IPO", "url": "https://www.renaissancecapital.com/IPO-Center/News/122657/anthropic-sets-terms-for-61-billion-ipo-targeting-a-1.2-trillion-market-cap"}]}, {"id": "s5", "cat": "政治・経済", "when": "11月15日", "title": "日銀ETF売却益、首相は減税でなく投資枠の財源に", "lede": "日銀のETF売却加速で増える国庫納付金の使い道を巡り、首相は消費減税の財源にはせず、成長投資の財源とする考えを示した。", "points": ["追加の売却益は年間1兆円規模と、財務省の会見録は説明している。", "首相は、経済安保上重要な分野の新たな特別会計の財源とする考えを述べた。", "消費減税の減収は年約5兆円とされ、国債に頼らない財源探しが続く。"], "background": "日銀は10月末の会合でETFの売却加速を決めた。保有は37兆円規模とされ、売却益の活用が議論されている。", "precedents": "日銀の国庫納付金は、保有資産の収益に左右される。過去には国債の利払い増で納付が減った例がある。", "history": "日銀は2010年にETF買い入れを始め、2020年代前半まで拡大した。売却は2024年以降に議論が本格化した。", "outlook": "減税の財源を何で賄うか、与党内の議論と来年度予算編成でどう整理されるかが焦点。", "check": {"level": "partial", "note": "日経の「二段構え」報道と、首相の答弁報道では説明が異なる。日経の原文は未確認。"}, "sources": [{"name": "熊本日日新聞（共同）｜首相、ETF売却益の使途を答弁", "url": "https://kumanichi.com/articles/2054758"}, {"name": "財務省｜大臣会見録（11月10日）", "url": "https://www.mof.go.jp/public_relations/conference/my20261110.html"}, {"name": "ニッポンドットコム（時事）｜ETF売却益と特別会計", "url": "https://www.nippon.com/ja/articles/-/57042"}]}]}, {"date": "2026-11-15", "newsDate": "2026-11-14", "note": "日曜版。検索で確認できた範囲に限って記載し、未確認の点は各記事の check に明記した。", "stories": [{"id": "s1", "cat": "国際", "when": "11月14日", "title": "初の米中ロ首脳会談へ 19日に中国で開催と報道", "lede": "トランプ米大統領、習近平国家主席、プーチン露大統領による初の3者会談が、APEC首脳会議に合わせ19日に中国・深センで開かれると日本の各紙が伝えた。核軍縮が議題の見通し。", "points": ["日本の各紙は、ホワイトハウスが19日の開催を発表し、核軍縮が議題になると報じた。", "トランプ氏は11月9日、中国でプーチン氏、習氏と会う見通しだと述べていた。", "中国政府は、3首脳の会談について協議していることを初めて認めていた。"], "background": "米国は軍備管理交渉に中国を加えたい考えで、10月にも3カ国での協議に意欲を示していた。ロシアも会談には前向きな姿勢を見せてきた。中国側は軍備管理には慎重とされる。", "precedents": "米ソ・米ロの首脳会談は冷戦期から繰り返されたが、中国を含む3者の首脳会談は前例がない。核軍縮では米ソ間の戦略兵器制限交渉（SALT）などが知られる。", "history": "冷戦期の核軍備管理は米ソの2国間が中心だった。中国は核戦力が米ロより小さいことを理由に、3カ国での交渉参加に一貫して消極的な立場をとってきた。", "outlook": "3者が実際に同席するか、核軍縮で具体的な枠組みに踏み込むかが焦点。ウクライナは議題にしない考えとも伝えられた。", "check": {"level": "partial", "note": "11月9日までの報道は確認。19日開催の正式発表と議題は日本の報道の記載で、検索では独立に確認できず。"}, "sources": [{"name": "EWN｜Trump says likely to meet Putin, Xi in China", "url": "https://www.ewn.co.za/2026/11/09/trump-says-likely-to-meet-putin-xi-in-china"}, {"name": "KSAT｜China confirms discussions are underway on a historic Xi-Trump-Putin meeting", "url": "https://www.ksat.com/news/politics/2026/11/06/china-confirms-discussions-are-underway-on-a-historic-xi-trump-putin-meeting/"}, {"name": "Arms Control Association｜White House Renews Call for Trilateral Arms Control Talks", "url": "https://www.armscontrol.org/act/2026-10/news/white-house-renews-call-trilateral-arms-control-talks"}]}, {"id": "s2", "cat": "外交", "when": "11月14日", "title": "ミャンマー問題、次期議長国に委ねる 比外相が表明", "lede": "ASEAN外相会議の場でフィリピンのラザロ外相が、ミャンマー問題への対応は次期議長国に委ねる考えを示したと共同通信が伝えた。", "points": ["ラザロ外相は今年の議長国外相で、ミャンマー担当の特使も務める。", "7月の外相会議では、進捗を測る基準づくりと、長期の特使の設置が議論された。", "ミャンマー指導部の首脳級会議への復帰は「まだ先」と同外相は述べている。"], "background": "ミャンマーは2021年の軍事クーデター後、ASEANの首脳級会議から排除されている。本来2026年の議長国はミャンマーの順番だったが、フィリピンが担った。次期の2027年議長国はシンガポール。", "precedents": "ASEANは2021年に5項目合意を決めたが、軍政側の履行は進んでいない。議長国は交代のたびにミャンマー対応を引き継いできた。", "history": "ASEANは1997年にミャンマーを加盟させた。内政不干渉を原則とするため、加盟国の内政問題への対応は難しいとされてきた。", "outlook": "15日開幕の首脳会議で、基準づくりや特使の設置が決まるかが焦点。タイ副首相は復帰に慎重な姿勢と伝えられている。", "check": {"level": "partial", "note": "14日の発言そのものは共同配信の報道のみで、独立した確認は取れず。7月までの経緯は複数媒体で確認。"}, "sources": [{"name": "Bernama｜Myanmar Returning To ASEAN Official Meetings 'Still Far Off' — Lazaro", "url": "https://asean.bernama.com/news.php?id=2585132"}, {"name": "Vietnam News｜ASEAN weighs benchmarks, longer-term envoy to revive stalled Myanmar peace plan", "url": "https://vietnamnews.vn/world/1785929/asean-weighs-benchmarks-longer-term-envoy-to-revive-stalled-myanmar-peace-plan.html"}]}, {"id": "s3", "cat": "政治・安全保障", "when": "11月14日", "title": "政府の安保広報にSNSで反発 「軍拡へ世論誘導」", "lede": "安保関連3文書の改定を前にした政府の安保広報に、SNSで批判が広がっている。野党も、手法や費用に疑問を示している。", "points": ["政府広報オンラインに、夫婦漫才風のキャラクターで安保を説く特集が10月26日ごろ公開された。", "国民民主党の玉木代表は、大臣が真剣に語る方が効果的ではないかと疑問を呈した。", "SNSには「軍拡プロパガンダ」といった批判が相次いだと報じられている。"], "background": "政府は3文書の年内改定を見据え、広報を拡充する方針。防衛費の大幅増が見込まれ、国民の理解を得る狙いがあるとされる。若年層と中高年層で媒体を分ける。", "precedents": "政府広報は、消費税や年金などの制度変更のたびに、芸能人の起用やCMで周知を図ってきた。ただ、安保分野では批判を招きやすい。", "history": "戦前は、新聞やラジオ、演芸が戦意の高揚に使われた。そのため、娯楽を通じた政府の宣伝には警戒感が根強い。", "outlook": "与党は広報を続ける構え。国会で費用や委託先をめぐる追及が強まるかが注目される。", "check": {"level": "partial", "note": "広報の内容と玉木氏の発言は複数媒体で確認。14日時点の反発の広がりと野党全体の動きは未確認。委託費の額は媒体の見出しのみ。"}, "sources": [{"name": "J-CAST｜玉木雄一郎氏、政府の「夫婦漫才」安保広報に疑問", "url": "https://www.j-cast.com/2026/11/04518903.html"}, {"name": "日刊ゲンダイ｜吉本興業が政府広報に参入", "url": "https://www.nikkan-gendai.com/articles/view/news/395219"}, {"name": "熊本日日新聞｜安保3文書改定へ広報拡充 政府、年齢層で媒体区別", "url": "https://kumanichi.com/articles/2050164"}]}, {"id": "s4", "cat": "経済・市場", "when": "11月14日", "title": "子育て世帯の中古住宅購入を支援 フラット35で金利優遇", "lede": "子育て世帯が中古住宅を買う際、長期固定ローン「フラット35」の金利を優遇する支援策を、共同通信が伝えた。", "points": ["既存の「子育てプラス」は、子ども1人につき当初5年間の金利が0.25%下がる仕組み。", "「子育てプラス」は、良質な中古住宅の取得も対象としている。", "フラット35の金利は今年に入り上昇している。"], "background": "住宅ローン金利は、日銀の利上げ観測などを背景に上昇傾向にある。中古住宅は新築より価格を抑えやすく、子育て世帯の取得を後押しする狙いとみられる。", "precedents": "フラット35は、2017年にも若い子育て世帯や親との同居・近居を対象に、金利を0.25%引き下げる優遇を設けていた。", "history": "フラット35は、住宅金融支援機構が民間金融機関と提携して扱う、最長35年の全期間固定金利型住宅ローンである。", "outlook": "今回の措置の対象や開始時期など、詳しい条件の公表が待たれる。", "check": {"level": "partial", "note": "11月14日の報道そのものは検索で確認できず。優遇制度の概要のみ確認。新措置の条件・時期は未確認。"}, "sources": [{"name": "モゲチェック｜子育て世帯向けフラット35金利優遇", "url": "https://mogecheck.jp/articles/show/JOeXZGMA4VGKENzBpmdP"}, {"name": "ダイヤモンド不動産研究所｜11月の住宅ローン金利動向予想", "url": "https://diamond-fudosan.jp/articles/-/1113355"}, {"name": "イオン銀行｜フラット35", "url": "https://www.aeonbank.co.jp/housing_loan/flat/flat35"}]}, {"id": "s5", "cat": "外交・経済", "when": "11月15日", "title": "首相、「アジア版IEA」を提唱へ 石油備蓄で連携", "lede": "高市首相は、AZEC首脳会合で、石油備蓄と緊急時の放出で連携する「アジア版国際エネルギー機関」の創設を提唱すると読売新聞が報じた。", "points": ["日本は4月、アジア向けに約100億ドルの金融協力を表明していた。", "ASEAN全体での共同備蓄の取り組みも、首脳会議で議論される見通し。", "日本とフィリピンは、11月にマニラでAZEC首脳会合を共催する方針だった。"], "background": "中東情勢の悪化で、アジアの原油調達が不安定になっている。日本は支援策で、ASEANの約1年分の原油輸入量に相当する調達を可能にするとした。", "precedents": "IEAは1974年の第1次石油危機を受けて設立された。加盟国は備蓄を持ち、緊急時に協調して放出する。", "history": "1973年の第1次石油危機で、日本は石油供給の途絶と物価高を経験した。以後、備蓄の整備が進んだ。", "outlook": "他の参加国が賛同するか、備蓄の融通の範囲をどこまで認めるかが焦点。4月の会合で日本は自国の備蓄は融通しないと説明していた。", "check": {"level": "partial", "note": "「アジア版IEA」の提唱は読売の報道のみで、検索では確認できず。4月の支援策と会合の予定は複数媒体で確認。"}, "sources": [{"name": "GMA News｜Japan plans $10 billion support to help Southeast Asia secure oil", "url": "https://www.gmanetwork.com/news/money/economy/984024/japan-plans-10-billion-support-to-help-southeast-asia-secure-oil/story/"}, {"name": "The Star｜Japan proposes co-hosting Asia Zero Emission Community Summit with Philippines", "url": "https://www.thestar.com.my/aseanplus/aseanplus-news/2026/10/20/japan-proposes-co-hosting-asia-zero-emission-community-summit-with-philippines"}, {"name": "Graphic Online｜Japan pledges $10bn to help Asian countries deal with oil crisis", "url": "https://www.graphic.com.gh/international/international-news/japan-pledges-10bn-to-help-asian-countries-deal-with-oil-crisis.html"}]}]}, {"date": "2026-11-13", "newsDate": "2026-11-12", "note": "", "stories": [{"id": "s1", "cat": "企業・市場", "when": "11月12日", "title": "エヌビディアのフアンCEOが辞任 株価一時14％安", "lede": "米半導体大手エヌビディアは、創業者のジェンスン・フアン氏がCEOと取締役を辞任したと発表した。株価は一時、前日終値比で約14％下落した。", "points": ["取締役会は12日、フアン氏の即時辞任を発表したと報じられている。", "株価は11日終値比で一時およそ14％の大幅安となった（NHK報道）。", "ロイターは、対中半導体規制をめぐりラトニック商務長官への批判が出ていると伝えた。"], "background": "9日、フアン氏が中国の情報機関と関係が疑われる企業幹部と私的な関係を持っていたとの報道が出て、株価が急落した。取締役会は独立調査を開始し、フアン氏は社員に謝罪した。その3日後に辞任が発表された。", "precedents": "創業者兼CEOが私生活や疑惑で退くのは、2018年のインテルCEO退任（社内規定違反の関係）などがある。ただし時価総額が世界最大級の企業の例は珍しい。", "history": "エヌビディアは1993年に創業され、フアン氏は創業以来トップを務めた。2020年代にはAI向け半導体で急成長し、米中の半導体規制の中心に位置してきた。", "outlook": "17日に予定される決算発表、後任人事、取締役会の調査結果、対中規制をめぐる議会の動きが焦点となる。", "check": {"level": "partial", "note": "辞任と株価急落はNHK・テレ朝・ロイター（見出し）で確認。後任や調査の詳細は未確認。辞任の理由は報道ベース。"}, "sources": [{"name": "NHK｜NVIDIA フアンCEOが辞任 業界全体に影響も 株価は一時およそ14％の大幅な下落", "url": "https://news.web.nhk/newsweb/na/nd-20261112de75078"}, {"name": "テレビ朝日系（ANN）｜アメリカ商務長官の進退協議と報道 エヌビディア・フアンCEOが辞任", "url": "https://news.yahoo.co.jp/articles/7bfbd742764d047b6d173252f13ed48dd200aa9f"}, {"name": "ロイター（ニューズウィーク日本版）｜対中半導体規制巡りラトニック長官に批判、エヌビディアＣＥＯ辞任で波紋", "url": "https://www.newsweekjapan.jp/articles/-/339963"}, {"name": "The Motley Fool｜Why Nvidia stock was falling today", "url": "https://www.fool.com/investing/2026/11/09/why-nvidia-stock-was-falling-today/"}]}, {"id": "s2", "cat": "企業・市場", "when": "11月12日", "title": "すかいらーく、博多ラーメン「Shin-Shin」を120億円で買収", "lede": "すかいらーくホールディングスは、福岡の博多ラーメン店「Shin-Shin」の全株式を約120億円で取得し、11月30日付で完全子会社にすると発表した。", "points": ["Shin-Shinは2003年創業で、福岡県内に7店舗を展開する。", "2026年3月期の連結売上高は17億円、純利益は8200万円と報じられている。", "低価格帯の業態を取り込み、都市部や海外での出店を強化する狙い。"], "background": "すかいらーくは、2027年12月期までの3年間でM&Aを3〜5件程度行う方針を掲げている。主力のファミリーレストランより価格の低い業態を加え、客層と出店先を広げようとしている。", "precedents": "同社は2024年に北九州発祥の「資さんうどん」を、2026年3月に定食チェーン「しんぱち食堂」を子会社化している。いずれも地域発の人気ブランドを全国に広げる型である。", "history": "すかいらーくは1970年に東京・国分寺で開業したファミリーレストランの草分けである。その後、チェーン展開で外食産業の拡大を支えた。", "outlook": "買収額に対し売上規模が小さいため、出店拡大や海外展開でどこまで収益を伸ばせるかが注目される。", "check": {"level": "ok", "note": "日経、共同通信（新潟日報配信）、Impress Watchなど複数媒体の見出し・要約で確認。"}, "sources": [{"name": "日本経済新聞｜すかいらーくHD、博多ラーメン「Shin-Shin」買収 低価格帯を強化", "url": "https://www.nikkei.com/article/DGXZQOUC119VB0R11C26A1000000/"}, {"name": "新潟日報（共同通信）｜すかいらーく、博多ラーメンの企業買収へ", "url": "https://www.niigata-nippo.co.jp/articles/-/941533"}, {"name": "Impress Watch｜すかいらーくHD、博多ラーメンの「Shin-Shin」を買収 世界展開へ", "url": "https://www.watch.impress.co.jp/docs/news/2156043.html"}]}, {"id": "s3", "cat": "国際", "when": "11月12日", "title": "米ロ首脳会談、中国APECに合わせ調整 米中ロ3者会談も視野", "lede": "共同通信は、米ロ首脳会談が中国でのAPECに合わせて来週開催の方向で調整されていると伝えた。トランプ氏は米中ロ3者会談の可能性にも触れている。", "points": ["APEC首脳会議は11月18〜19日に中国・深圳で開かれる。", "トランプ氏は8日、習近平氏とプーチン氏を含む3者会談の可能性に言及した。", "米中外相は首脳会談に向けて事前に調整したと報じられている。"], "background": "ウクライナ和平、核軍備管理、イラン情勢などが議題に挙がるとみられる。中国は議長国として米ロ双方との対話の場を提供する立場にある。", "precedents": "2025年8月にはアラスカで米ロ首脳会談が開かれたが、和平合意には至らなかった。", "history": "米ソ・米ロの首脳会談は、冷戦期のジュネーブ会談（1985年）など軍備管理の節目で開かれてきた。三大国が同席する形は、1945年のヤルタ会談を連想させる。", "outlook": "開催の確定、議題、日ロ首脳の接触の有無、会談後のウクライナ情勢への影響が焦点となる。詳しくは11月12日号。", "check": {"level": "partial", "note": "共同通信、産経、日経の見出し・要約で調整の動きを確認。開催日や議題は確定情報でなく、日ロ首脳接触の報道は未確認。"}, "sources": [{"name": "共同通信（Yahoo!ニュース）｜米ロ首脳会談、来週で調整中 中国でのAPECに合わせ", "url": "https://news.yahoo.co.jp/articles/0cc863773449973e70c42eb68a2c99f58ff1e766"}, {"name": "産経新聞（Yahoo!ニュース）｜米中外相が中国・深圳での首脳会談に向け事前調整", "url": "https://news.yahoo.co.jp/articles/cdfc0209ee9028263e211dd536cb5c90e5c8ad6a"}, {"name": "Infoseekニュース｜米中露首脳による3者会談実現へ思惑交錯 APEC深セン会議控え", "url": "https://news.infoseek.co.jp/topics/globalnewsasia_12185/"}]}, {"id": "s4", "cat": "安全保障", "when": "11月12日", "title": "在日米軍駐留経費、日本が増額検討 米の圧力背景", "lede": "朝日新聞は、在日米軍の駐留経費をめぐり、日本政府が負担を3千億円超へ増やす方向で検討していると報じた。米側の圧力が背景にある。", "points": ["2027年度からの5年間の負担が対象で、年末までの合意を目指す。", "共同通信は、米側が現行の約3倍となる3兆円超を要求したと報じた。", "朝日の3千億円超が年額か総額かは、確認できていない。"], "background": "駐留経費は原則5年ごとに特別協定で定める。トランプ政権は同盟国に防衛負担の拡大を求めており、日本にも強い要求が向けられている。", "precedents": "2021年末の合意では、2022〜26年度の5年間で約1兆551億円（年平均約2110億円）とされた。", "history": "駐留経費の負担は1978年、「思いやり予算」として始まった。その後、特別協定の形で拡大し、更新のたびに交渉が行われてきた。", "outlook": "米側の要求額と日本側の提示額の差、防護強化費用の扱いが、年末の合意に向けた焦点となる。", "check": {"level": "partial", "note": "朝日と共同の見出し・要約のみ確認し、本文は未確認。金額は両社で桁が異なり、年額か総額かも不明。"}, "sources": [{"name": "朝日新聞（Yahoo!ニュース）｜在日米軍駐留経費の日本負担、3千億円超へ増額検討 米の圧力背景に", "url": "https://news.yahoo.co.jp/articles/8c673f0d8c4ba5365c0a54c845b18ffd3351a318"}, {"name": "共同通信（Yahoo!ニュース）｜思いやり予算5年で3兆円超要求 米軍駐留経費負担、大幅増へ", "url": "https://news.yahoo.co.jp/articles/9cc65f256f4efda42146651ba6770d3179599534"}, {"name": "秋田魁新報｜【独自】政府、米軍施設の防護強化検討 夏にも駐留費交渉、日本負担増も", "url": "https://www.sakigake.jp/news/article/20260425CO0098/"}]}, {"id": "s5", "cat": "経済・市場", "when": "11月12日", "title": "円相場、一時160円台に 約2か月ぶりの円安水準", "lede": "12日のニューヨーク外国為替市場で、円相場は一時1ドル＝160円台まで下落した。9月上旬以来、約2か月ぶりの円安水準となった。", "points": ["米国の追加利上げ観測が強まったことが背景とみられる。", "市場では政府・日銀による為替介入への警戒感も出ている。", "日銀審議委員が利上げに慎重な姿勢を示したとの報道もある。"], "background": "日米の金利差が意識されると円を売ってドルを買う動きが出やすい。10日に発表された米経済指標が利上げ観測を強めたとされる。", "precedents": "2026年の春から夏にも円は160円台に下落し、4月末と7月31日に介入が実施された。", "history": "1ドル160円台は1990年以来の水準で、2024年にも到達した。当時、政府は大規模な介入で対応した。", "outlook": "介入の有無、米利上げの見通し、日銀の次回会合での判断が、円相場の方向を左右する。", "check": {"level": "partial", "note": "テレビ朝日系の記事1本で確認。独立した2媒体目は未確認。日銀審議委員の発言は見出しのみで本文は未確認。"}, "sources": [{"name": "テレビ朝日系（ANN）｜およそ2か月ぶり 1ドル＝160円台に 米追加の利上げ観測強まる", "url": "https://news.yahoo.co.jp/articles/c49ad0f1408ff2722defe34866f003dc8b578ec1"}]}]}, {"date": "2026-11-12", "newsDate": "2026-11-11", "note": "検索で11日当日の報道を直接確認できた記事が少なく、全5本を「partial」としています。", "stories": [{"id": "s1", "cat": "政治・経済", "when": "11月11日", "title": "消費減税法案、参院で審議入り 首相が出席", "lede": "衆院を通過した消費税減税関連法案が、参院本会議で審議入りした。与党は参院で過半数に届かず、野党の協力が成立の鍵となる。", "points": ["法案は6日の衆院本会議で自民、維新などの賛成多数で可決され、参院に送付された。", "参院は与党が過半数に届かず、国民民主党と公明党への働き掛けが焦点になる。", "政府・与党は12月12日の会期末までの成立を目指している。"], "background": "衆院では年5兆円規模とされる財源や新たな給付の制度設計が十分に示されず、野党は説明が曖昧だと批判した。参院でも財源が論戦の中心になる見通し。", "precedents": "日本の消費税は1989年の導入後、1997年に5%、2014年に8%、2019年に10%へ段階的に引き上げられてきた。税率を下げる法案が国会で審議されるのは異例である。", "history": "消費税は1989年に3%で始まった。以後、税率引き上げは延期や軽減税率の導入など政治的な争点となり、政権の命運を左右することもあった。", "outlook": "国民民主・公明が賛成に回るか、財源の裏付けが示されるかが焦点。会期末までに採決へ進めるかを見たい。", "check": {"level": "partial", "note": "衆院通過と日程は複数媒体で確認。11日に実際に審議入りした点と首相答弁の詳細は直接確認できていない。"}, "sources": [{"name": "熊本日日新聞｜消費減税、衆院で論戦スタート 法案審議入り、飲食料品1%", "url": "https://kumanichi.com/articles/2048549"}, {"name": "神奈川新聞（カナロコ）｜消費減税関連の記事", "url": "https://www.kanaloco.jp/news/social/article-1313854.html"}, {"name": "熊本日日新聞｜消費減税、野党に協力要請 小林氏「参院で少数与党」", "url": "https://kumanichi.com/articles/2041776"}]}, {"id": "s2", "cat": "外交", "when": "11月11日", "title": "台湾、APEC首脳会議に特使派遣へ 対等参加求める", "lede": "台湾は、中国・深圳で開かれるAPEC首脳会議に特使を送る方向だと報じられた。台湾側は対等で尊厳ある参加を求めている。", "points": ["首脳会議は11月18〜19日に深圳で開かれる。", "卓栄泰首相は、特使が招待状を直接届ける慣例に沿うよう中国に求めた。", "中国側はメールで連絡し、正式な招待状ではないと台湾側は受け止めている。"], "background": "台湾はAPECに「チャイニーズ・タイペイ」の名で参加している。中国が議長国のため、参加の形式をめぐる駆け引きが起きやすい。", "precedents": "2024年のペルー会議では、台湾が最初に指名した陳建仁・元副総統が開催国に受け入れられず、宏碁（エイサー）創業者の施振栄氏に代わった。", "history": "台湾は1991年にAPECへ加盟した。首脳会議には総統でなく特使を送るのが通例で、これは中台の取り決めの名残である。", "outlook": "正式な招待状が届くか、台湾が出席を最終決定するかが注目点。", "check": {"level": "partial", "note": "11月3日の台湾側報道で、招待の形式と対等参加の要求を確認。11日の特使決定は直接確認できていない。"}, "sources": [{"name": "Focus Taiwan｜APEC招待をめぐる行政院長の発言（11月3日）", "url": "https://focustaiwan.tw/politics/202611030015"}, {"name": "Taipei Times｜APEC深圳会議への台湾の参加をめぐる報道（9月21日）", "url": "https://www.taipeitimes.com/News/taiwan/archives/2026/09/21/2003864622"}]}, {"id": "s3", "cat": "外交", "when": "11月12日", "title": "米中外相が電話会談 APEC・G20成功へ協力", "lede": "米中の外相が電話で会談し、王毅氏は意思疎通と協力の強化を訴えたと報じられた。APEC首脳会議などを控えた調整とみられる。", "points": ["王毅外相が意思疎通と協力の強化を呼びかけたと新華社が伝えた。", "日本の報道は、APECとG20の首脳会議の成功に向けた相互協力を伝えている。", "会談の詳細は、当日の報道の範囲では限られている。"], "background": "米中は首脳級の往来を重ねる局面にあり、外相間の電話は首脳会談前の地ならしとして行われることが多い。", "precedents": "2025年10月27日にも、韓国でのAPEC首脳会議に合わせた米中首脳会談の前に、王氏とルビオ国務長官が電話会談をした。", "history": "米中は1979年に国交を正常化した。以後、台湾問題や通商をめぐり、緊張と対話を繰り返してきた。", "outlook": "深圳APECに合わせた米中首脳会談が実現するか、成果文書に何が入るかが焦点。", "check": {"level": "partial", "note": "過去の電話会談の事実は確認。今回の通話内容は日本の見出し情報のみで、一次情報や英文報道は確認できていない。"}, "sources": [{"name": "Caixin｜Wang Yi, Rubio hold phone call as China, US seek to steady relations", "url": "https://www.caixinglobal.com/2025-10-28/wang-yi-rubio-hold-phone-call-as-china-us-seek-to-steady-relations-102376208.html"}, {"name": "Vietnam News｜Chinese FM Wang, US Secretary of State Rubio hold phone call", "url": "https://vietnamnews.vn/world/1728307/chinese-foreign-minister-wang-us-secretary-of-state-rubio-hold-phone-call-in-preparation-for-high-level-engagements.html"}]}, {"id": "s4", "cat": "国際", "when": "11月11日", "title": "米中ロ首脳会談、核とAIの規制を議論か 香港紙", "lede": "米中ロの首脳会談が実現した場合、核兵器へのAI利用の規制が議題になる可能性があると香港紙が報じた。実現は確定していない。", "points": ["香港紙の報道を共同通信などが伝えた。政府の公式発表ではない。", "米中は、深圳APECに合わせた首脳会談でAI協力を成果の候補にしていると報じられている。", "米ロ首脳会談は来週調整中と報じられたが、確認できていない。"], "background": "AIの軍事利用が広がる中、核兵器の指揮統制に人工知能を関与させない取り決めが各国で課題になっている。", "precedents": "2024年11月のリマでの米中首脳会談では、核兵器使用の判断は人間が行うべきだとの認識が確認されたと報じられた。", "history": "米ソは冷戦期に戦略兵器制限交渉（SALT）などで核の管理を進めた。中国を含む三者の枠組みは前例がない。", "outlook": "三者会談が開かれるか、核とAIが議題になるかを見たい。", "check": {"level": "partial", "note": "米中のAI協力の準備は報道で確認。米中ロ会談と核AI規制の議論は、今回の検索で独立に確認できていない。"}, "sources": [{"name": "SCMP｜US and China race to shape AI agenda ahead of Xi-Trump talks in Shenzhen", "url": "https://scmp.com/news/china/diplomacy/article/3370926/us-and-china-race-shape-ai-agenda-ahead-xi-trump-talks-shenzhen-sources-say"}, {"name": "Yahoo News｜China's Xi pushes for global AI body at APEC", "url": "https://www.yahoo.com/news/articles/chinas-xi-pushes-global-ai-045049885.html"}]}, {"id": "s5", "cat": "外交", "when": "11月12日", "title": "米、台湾政府機関へ連邦職員を派遣へ 新制度", "lede": "米国が連邦政府職員を台湾の政府機関に派遣する新たな制度を設けると、共同通信やロイターが報じた。米台の関係強化の動きとなる。", "points": ["報道では、米連邦職員が台湾で最長1年勤務する仕組みとされる。", "派遣先や人数など制度の詳細は、今回の検索では確認できていない。", "米国には、職員を台湾に派遣する根拠規定がすでにある。"], "background": "米国は台湾との実務的な結びつきを強めており、職員を相手側機関で働かせる制度は、政策の連携を深める手段になる。", "precedents": "2022年12月の国防権限法に台湾フェローシップ法が盛り込まれ、毎年10人以上の職員を台湾に送る枠組みが作られた。", "history": "米国は1979年に台湾と断交し、台湾関係法を制定した。以来、米国在台協会（AIT）を窓口に実務関係を続けている。", "outlook": "制度の運用開始時期と、中国側の反応が焦点となる。", "check": {"level": "partial", "note": "既存の台湾フェローシップ制度は確認。今回報じられた新制度そのものは、検索で独立に確認できていない。"}, "sources": [{"name": "Taipei Times｜台湾フェローシップ法に関する報道（2023年1月10日）", "url": "https://www.taipeitimes.com/News/taiwan/archives/2023/01/10/2003792327"}, {"name": "米国法典 22 U.S.C. § 3386", "url": "https://www.govinfo.gov/link/uscode/22/3386"}]}]}, {"date": "2026-11-11", "newsDate": "2026-11-10", "note": "", "stories": [{"id": "s1", "cat": "外交", "when": "11月10日", "title": "日中首脳会談、APEC前に調整不調と報道", "lede": "18日からのAPECを前に、日中首脳会談の実現に向けた調整が不調に終わったと共同通信などが報じた。中国側が応じていないという。", "points": ["共同通信は、中国側が首相の国会答弁に反発し会談を拒否していると独自報道した。", "10月上旬には、中国が習近平氏ではなく李強首相との会談を提案したとの香港紙報道があった。", "首相は16日からフィリピンと中国を訪れ、ASEAN・APEC首脳会議に出席する予定。"], "background": "高市首相は2025年11月、台湾有事が存立危機事態になり得るとの趣旨の国会答弁をした。中国は撤回を求め続けており、対話の再開条件として位置づけているとみられる。日本政府は答弁を変えない姿勢で、双方の溝が続いている。", "precedents": "2012年の尖閣国有化後、日中首脳が正式に会談できたのは2014年11月、北京APECでの安倍・習会談まで約2年かかった。この時は4項目の合意文書でようやく糸口を作った。", "history": "日中は1972年の国交正常化以来、共同声明など4つの政治文書を土台にしてきた。台湾問題は一貫して最も敏感な論点で、日本は「中国の立場を十分理解し尊重する」との表現で線を引いてきた。", "outlook": "APEC本番で立ち話や短時間の接触が行われるか、中国が李強首相との会談を再提示するかが焦点となる。", "check": {"level": "partial", "note": "調整不調は共同通信系の独自報道。検索では10月の香港紙報道の転載のみ確認でき、両政府の公式発表は未確認。"}, "sources": [{"name": "Nation Thailand｜Japan-China summit faces uncertainty ahead of APEC meeting", "url": "https://www.nationthailand.com/news/world/40073263"}, {"name": "nippon.com（時事）｜APEC首脳会談を巡る日中の調整", "url": "https://www.nippon.com/ja/news/yjj2026100800344/"}, {"name": "Kyung Hyang Shinmun｜日中首脳会談を巡る報道", "url": "https://www.khan.co.kr/en/article/202610081555027"}]}, {"id": "s2", "cat": "国際", "when": "11月10日", "title": "G7外相会合が閉幕、ウクライナの電力支援で一致", "lede": "パリで開かれたG7外相会合が2日間の日程を終えた。冬を前に、攻撃で弱った電力インフラへの支援継続と、完全な停戦の重要性を確認した。", "points": ["茂木外相によると、冬を越すためのエネルギー支援に取り組むことで一致した。", "ウクライナのシビハ外相も出席し、弾道ミサイル攻撃で傷んだ電力分野が議題になった。", "米露ウクライナの高官協議が10〜11日に予定され、EUのカラス氏は露側の譲歩が必要と述べた。"], "background": "ロシアは2022年秋以降、ウクライナの発電所や送電網を繰り返し攻撃してきた。厳しい冬の暖房や給水が脅かされるため、G7は電力機材の供与や復旧支援を重ねている。", "precedents": "2022年10月のG7外相会合（ミュンスター）では、ウクライナの重要インフラ復旧を支援する調整の枠組みを設けた。冬前に電力支援を打ち出す流れは毎年続いている。", "history": "G7は1970年代の経済協議体として始まり、冷戦後は国際政治全般を扱うようになった。ロシアは2014年のクリミア併合を受けてG8から外れ、以後G7が対露対応の中心となっている。", "outlook": "共同声明が公表されるか、その中で制裁や停戦条件にどこまで踏み込むかが焦点となる。米露ウクライナ協議の行方も影響する。", "check": {"level": "partial", "note": "共同通信・読売の報道内容を複数紙で確認。共同声明の公表と全文は未確認。"}, "sources": [{"name": "共同通信｜G7外相、ウクライナ支援一致 ミサイル攻撃で弱体化の電力分野", "url": "https://news.yahoo.co.jp/articles/5571833020df83865f26280b12ce1db16500b575"}, {"name": "新潟日報（共同）｜Ｇ７外相会合が閉幕", "url": "https://www.niigata-nippo.co.jp/articles/-/940323"}, {"name": "Yahoo!ニュース（読売）｜G7外相会合 ウ支援で声明公表へ", "url": "https://news.yahoo.co.jp/pickup/6602111"}]}, {"id": "s3", "cat": "企業・市場", "when": "11月10日", "title": "りそなHD、M&A仲介大手MACPと資本業務提携", "lede": "りそなHDはM&Aキャピタルパートナーズ（MACP）と資本業務提携を結んだ。社長らの保有株の約5%を取得し、中小企業の事業承継支援を強める。", "points": ["株式取得は11月13日で、取得額は約70億円と報じられた。", "M&Aを望む顧客を相互に紹介し、仲介やFA業務で連携する。", "人材交流でM&A人材も育成する。業績への影響は軽微の見込み。"], "background": "中小企業では経営者の高齢化と後継者不足が進み、事業承継の手段としてM&Aが増えている。銀行は取引先を知る強みがある一方、仲介の専門人材が不足しており、外部との提携で補う狙いがある。", "precedents": "地銀や大手行は近年、M&A仲介会社やベンチャーと提携・出資して法人向け手数料収入を伸ばす動きを強めてきた。りそなも他社との資本業務提携を重ねている。", "history": "日本の銀行は長く融資の利ざやに収益を頼ってきた。1990年代の不良債権問題を経て、手数料ビジネスへの転換が経営課題となった。", "outlook": "紹介件数や成約数がどこまで伸びるか、他行が同様の提携に動くかが注目される。", "check": {"level": "ok", "note": "NHK、テレ東BIZ、日経、ロイター、りそなの適時開示で確認。決算期の表記が報道により異なる。"}, "sources": [{"name": "NHK｜りそなHD M＆A支援体制強化へ 仲介大手と資本業務提携", "url": "https://news.web.nhk/newsweb/na/nd-20261110de73783"}, {"name": "テレ東BIZ｜りそなHD M＆Aキャピタルパートナーズと資本業務提携", "url": "https://txbiz.tv-tokyo.co.jp/you/news/post_352224"}, {"name": "日本経済新聞｜りそなの4〜9月期、純利益21%増 M&Aキャピタルと資本提携も発表", "url": "https://www.nikkei.com/article/DGXZQOUB044UF0U6A101C2000000/"}, {"name": "りそなホールディングス｜2026年11月10日付ニュースリリース", "url": "https://www.resona-gr.co.jp/holdings/news/newsrelease_c/2026/files/20261110_7t.pdf"}]}, {"id": "s4", "cat": "安全保障", "when": "11月10日", "title": "原子力潜水艦、導入視野に検討へ 安保3文書改定", "lede": "政府が年内の安保3文書改定で、原子力潜水艦の導入を視野に入れた検討を盛り込む方向で調整していると朝日新聞が報じた。", "points": ["小泉防衛相は9月、原潜保有を「あらゆる選択肢を排除せず検討する」と述べた。", "維新は6月に導入を提言。自民案は「次世代の動力の活用」と表現し、原潜とは書いていない。", "有識者会議では、人員確保の難しさなどから慎重論も出た。"], "background": "中国の海洋進出や周辺海域での活動が増え、長期間潜航できる原潜に抑止力の面で関心が集まっている。ただし巨額の費用や運用技術、人員の確保が課題とされる。", "precedents": "2021年に米英豪がAUKUSを発足させ、豪州が原潜の取得を決めた。日本は原潜を保有しておらず、その検討は異例といえる。", "history": "日本の原子力利用は1955年の原子力基本法で平和目的に限られている。原子力船「むつ」は1974年に放射線漏れを起こし、原子力の艦船利用への抵抗感は根強い。", "outlook": "改定文書で「調査・研究」にとどめるのか、より踏み込むのか、非核三原則や原子力基本法との整合がどう議論されるかが焦点となる。", "check": {"level": "partial", "note": "朝日の11月10日付報道そのものは検索で未確認。9〜10月の複数報道で政府・与野党の検討状況を確認した。"}, "sources": [{"name": "熊本日日新聞｜小泉防衛相、原潜保有を排除せず 安保3文書改定で議論", "url": "https://kumanichi.com/articles/2034875"}, {"name": "秋田魁新報｜【独自】維新、原子力潜水艦の導入提言へ", "url": "https://www.sakigake.jp/news/article/20260616CO0162/"}, {"name": "秋田魁新報｜原潜保有、有識者から慎重論 安保3文書、議事要旨公開", "url": "https://www.sakigake.jp/news/article/20260626CO0309/"}]}, {"id": "s5", "cat": "政治・経済", "when": "11月11日", "title": "小泉防衛相、総裁選不出馬の意向と報道", "lede": "小泉防衛相が次の自民党総裁選に出馬しない意向を示し、高市首相が出馬するなら「全力で支える」と語ったと報じられた。", "points": ["47NEWS、読売新聞などが11日朝に伝えた。", "小泉氏は9月にも、首相をどのような立場でも全力で支えたいと述べていた。", "前回総裁選に出た面々が次を見据えて動いているとの報道もある。"], "background": "小泉氏は2025年の総裁選で高市氏に次ぐ次点で、高市政権では防衛相を務める。不出馬は首相の再選を後押しし、党内の主導権争いを抑える意味を持つとみられる。", "precedents": "現職首相が総裁選で再選を目指す場合、有力な対抗馬が出ず無投票に近い形になる例は過去にもある。党内の支持を固める動きが先行するのが通例。", "history": "自民党総裁選は党員投票を含む方式と国会議員中心の方式があり、任期は3年である。党首選びが事実上の首相選びとなるため、政権の求心力を左右してきた。", "outlook": "首相が再選を目指すと明言するか、他に名乗りを上げる議員が出るかが注目される。", "check": {"level": "partial", "note": "11日の発言そのものは検索で確認できず、報道各社の見出しのみ。9月の「全力で支える」発言は神戸新聞で確認。"}, "sources": [{"name": "神戸新聞｜小泉防衛相が首相を全力で支える趣旨の発言", "url": "https://www.kobe-np.co.jp/news/zenkoku/compact/202609/0020787887.shtml"}, {"name": "北海道新聞｜高市総裁、小泉氏を防衛相で調整", "url": "https://www.hokkaido-np.co.jp/article/1224455/"}]}]}, {"date": "2026-11-10", "newsDate": "2026-11-09", "note": "検索の裏取りで11月9日当日の記事を十分に確認できず、全5本が一部未確認（partial）です。", "stories": [{"id": "s1", "cat": "外交", "when": "11月9日", "title": "G7外相会合がパリで開幕、ウクライナ・イランが焦点", "lede": "G7外相会合が9〜10日の日程でパリで始まった。米中間選挙後初の会合で、米国の外交方針を見極める場となる。", "points": ["ウクライナ外相を招いた別枠の会合が設けられる予定と報じられた。", "報道によれば、ウクライナ情勢とイラン情勢が主要議題。", "米国のルビオ国務長官は中間選挙後、初の国際会議に臨む。"], "background": "G7は議長国フランスの下で外相会合を重ねてきた。ロシアのウクライナ侵攻の長期化と中東情勢の緊迫で、米欧の温度差が目立つ。中間選挙の結果が米外交にどう影響するかが各国の関心事となっている。", "precedents": "2026年3月にもパリ近郊でG7外相会合が開かれ、イラン情勢やウクライナ支援をめぐり米欧の見解の違いが取り沙汰されたが、共同声明は出された。", "history": "G7は1970年代の石油危機後の経済協議を起源とし、のちに外相会合など政治・安全保障分野へ協議を広げた。1990年代にロシアが加わりG8となったが、2014年のクリミア併合で参加資格停止となった。", "outlook": "会合後に共同声明が出るか、ウクライナ支援とイランへの対応で米欧が歩み寄れるかが焦点。", "check": {"level": "partial", "note": "会合の日程・場所は確認。開幕後の議論内容は検索で確認できず、見出し候補の報道に拠る。"}, "sources": [{"name": "Eurointegration｜G7 to hold separate meeting on Ukraine with Ukrainian foreign minister in attendance", "url": "https://www.eurointegration.com.ua/eng/news/2026/11/6/7249434/index.amp"}, {"name": "Ukrainska Pravda｜G7 to hold separate meeting on Ukraine with Ukrainian foreign minister in attendance", "url": "https://www.pravda.com.ua/eng/news/2026/11/06/8061566/"}]}, {"id": "s2", "cat": "外交", "when": "11月9日", "title": "日越首脳会談、中国念頭に連携強化で一致", "lede": "高市首相はベトナム首脳と会談し、重要鉱物や経済安全保障、原子力などでの協力を進めることで一致したと報じられた。", "points": ["複数の報道は、中国を念頭に連携強化で一致したと伝えた。", "重要鉱物について首相は「協力を加速」と述べたと報じられた。", "報道によれば、原発建設への協力でも首脳が合意した。"], "background": "続報。詳しくは11月9日号。", "precedents": "日本は2026年5月にもハノイで首脳会談を行い、重要鉱物の供給網やエネルギーを新たな優先協力分野とした。", "history": "日本とベトナムは2023年に「包括的戦略的パートナーシップ」へ関係を格上げした。日本は長年ベトナム最大級の援助国で、2000年代にはベトナムの原発計画に協力したが、その計画は2016年に中止された。", "outlook": "合意が具体的な案件や資金支援にどう結びつくか、中国の反応も注目される。", "check": {"level": "partial", "note": "11月9日の会談自体は検索で確認できず、5月の会談の記録のみ確認。当日の内容は候補見出しの報道に拠る。"}, "sources": [{"name": "首相官邸｜Japan-Viet Nam Summit Meeting (Summary)", "url": "https://japan.kantei.go.jp/105/diplomatic/202605/02vietnam.html"}, {"name": "Al Jazeera｜Japan's Takaichi pledges deeper energy cooperation with Vietnam", "url": "https://www.aljazeera.com/news/2026/5/2/japans-takaichi-pledges-deeper-energy-cooperation-with-vietnam"}]}, {"id": "s3", "cat": "経済・市場", "when": "11月9日", "title": "7月30日の為替介入は7.9兆円、過去最大と公表", "lede": "財務省の公表で、政府・日銀が7月30日に行った円買い介入が7.9兆円と過去最大だったことが分かったと報じられた。", "points": ["報道によれば、円安を食い止める目的の介入だった。", "これまでの1日あたり最大は4月30日の6兆2787億円だった。", "産経は、円安の構造的要因は払拭できていないと指摘した。"], "background": "2026年は円安が進み、4月末から5月にかけても大規模な介入が行われた。日米金利差や貿易構造など、円安の背景は根深い。", "precedents": "2022年9〜10月にも政府・日銀は円買い介入を行い、当時として過去最大規模の総額となった。", "history": "日本の為替介入は1990年代から断続的に行われ、1998年の円買い介入や2011年の震災後のG7協調介入などが知られる。", "outlook": "円相場が再び急落した場合、追加介入に踏み切るか、日銀の利上げ判断との関係が注目される。", "check": {"level": "partial", "note": "7.9兆円は検索で確認できず（共同は6〜7兆円の推計）。4月30日の記録は確認。公表額は財務省の発表で要確認。"}, "sources": [{"name": "共同通信（OANDA掲載）｜為替介入、過去最大の6・2兆円", "url": "https://www.oanda.jp/lab-education/market_news/kn_2026080701000327/"}, {"name": "野村総研｜木内登英コラム（2026年8月3日）", "url": "https://www.nri.com/jp/media/column/kiuchi/20260803.html"}]}, {"id": "s4", "cat": "国際", "when": "11月9日", "title": "仏スーパー冷蔵設備攻撃、イラン関与の疑いと報道", "lede": "10月に仏スーパー約700店で冷蔵設備が乗っ取られた事件で、イラン革命防衛隊のサイバー部隊の関与を指摘する報道が出た。", "points": ["テレビ朝日系は、革命防衛隊の部隊が特定されたと伝えた。", "報道では仏外相が「相応の報い」を受けると述べたとされる。", "日本政府も冷凍・冷蔵システムへの不正アクセスに注意喚起した。"], "background": "攻撃は10月11〜12日ごろに起き、庫内温度が最高50度まで上がって食品が廃棄された。デンマーク企業の制御機器の脆弱性が指摘されている。", "precedents": "2021年には米コロニアル・パイプラインが身代金要求型ウイルスで停止し、重要インフラへのサイバー攻撃の危険が広く認識された。", "history": "2010年のスタクスネットは、制御システムへのサイバー攻撃が物理的被害をもたらし得ることを示した初期の例として知られる。", "outlook": "仏当局が公式に攻撃元を認定するか、欧州が制裁など対抗措置を取るかが焦点。", "check": {"level": "partial", "note": "攻撃の発生と規模は複数媒体で確認。イラン関与は検索で確認できず、当時は攻撃者未特定とされていた。"}, "sources": [{"name": "Al Jazeera｜Hundreds of supermarkets in France hit by 'unprecedented' cyberattack", "url": "https://aljazeera.com/news/2026/10/13/unprecedented-cyberattack-hits-french-supermarkets-causing-food-losses"}, {"name": "AP（News4JAX掲載）｜Cyberattack targeting refrigeration systems hits 700 supermarkets", "url": "https://www.news4jax.com/business/2026/10/13/cyberattack-targeting-refrigeration-systems-hits-700-supermarkets-french-government-says/"}]}, {"id": "s5", "cat": "政治", "when": "11月9日", "title": "高市首相、AI会合で国際連携を呼びかけ", "lede": "高市首相は仏政府主催のAI会合にオンラインで出席し、高性能AIの進展を受けた国際社会の連携を訴えたと報じられた。", "points": ["共同・時事・NHKが、首相が国際連携の必要性を述べたと伝えた。", "G7の一部首脳もオンラインで参加したと報じられた。", "首相の会合欠席をめぐり、国内では批判と反論が出ている。"], "background": "日本は「広島AIプロセス」を主導し、AIの国際的なルール作りに積極的な姿勢を示してきた。4月の日仏首脳会談ではAIの高官級対話の立ち上げで一致した。", "precedents": "2023年の英国AI安全サミットでは、AIの危険性に関する「ブレッチリー宣言」が採択された。", "history": "2023年のG7広島サミットで、生成AIの国際ルールを話し合う「広島AIプロセス」が始まった。", "outlook": "日仏が準備する枠組みが具体的なルールづくりに進むか、日本開催のAIサミット構想の行方が注目される。", "check": {"level": "partial", "note": "今回の会合自体は検索で確認できず。日仏のAI協力の経緯のみ官邸資料で確認。当日の内容は候補見出しの報道に拠る。"}, "sources": [{"name": "首相官邸｜日仏首脳会談（2026年4月）", "url": "https://www.kantei.go.jp/jp/105/actions/202604/01french.html"}, {"name": "首相官邸｜内閣総理大臣記者会見（2026年11月5日）", "url": "https://www.kantei.go.jp/jp/105/statement/2026/1105kaiken.html"}]}]}, {"date": "2026-11-09", "newsDate": "2026-11-08", "note": "日曜の朝刊のため動きが少ない。日越首脳会談など一部は当日の動きが未確認。", "stories": [{"id": "s1", "cat": "国際", "when": "11月8日", "title": "イラン外相「要求受理か戦争か」 米に揺さぶり", "lede": "イランのアラグチ外相が、米国に対しイランの要求を受け入れるか戦争かの選択を迫る趣旨の発言をした。米軍の対イラン海上封鎖も続く。", "points": ["共同通信系の配信で、アラグチ外相が「要求受理か、戦争か」と米国に迫ったと報じられた。", "ロイターは、米軍がオマーン湾で貨物船を航行不能にし封鎖措置を強めると伝えた。", "イランは制裁解除などを条件にホルムズ海峡を再開する用意があるとの立場を示している。"], "background": "今年2月の米・イスラエルによる対イラン攻撃以降、米国は海上封鎖を続けている。イランは凍結資産の解放や制裁解除を求め、米国は核開発の大幅な制限を求めて、双方の主張は平行線をたどる。カタールやパキスタンが仲介している。", "precedents": "2019年の米国によるイラン産原油の全面禁輸と、その後のタンカー攻撃事件でも、制裁と海上での威嚇が並行して進み、緊張が高まった。", "history": "1980年代のイラン・イラク戦争中の「タンカー戦争」以来、ホルムズ海峡は世界の原油輸送の要衝として、イランと米国の対立の舞台になってきた。", "outlook": "米中間選挙後に米国が軍事行動に出るのか、仲介による協議が続くのかが焦点となる。", "check": {"level": "partial", "note": "外相発言の原文は未確認。封鎖と交渉の経緯はAl Jazeera等の10〜11月の報道で確認。11月8日のオマーン湾の事案は未確認。"}, "sources": [{"name": "Al Jazeera｜Iran and US explore diplomacy amid rising threats of war", "url": "https://www.aljazeera.com/news/2026/11/1/iran-and-us-explore-diplomacy-amid-rising-threats-of-war"}, {"name": "Boston Globe｜Iran says it would reopen Strait of Hormuz in 2 days as part of US deal", "url": "https://www.bostonglobe.com/2026/11/02/world/iran-says-it-would-reopen-strait-hormuz-2-days-part-us-deal/"}, {"name": "Al Jazeera｜US forces disable ship attempting to run Iran blockade in Gulf of Oman", "url": "https://aljazeera.com/news/2026/10/11/us-forces-disable-ship-attempting-to-run-iran-blockade-in-gulf-of-oman"}]}, {"id": "s2", "cat": "外交", "when": "11月8日", "title": "高市首相、日朝首脳会談へ意欲 拉致被害者の集会で", "lede": "高市首相は東京での拉致被害者の帰国を求める集会で、日朝首脳会談の実現に向けて行動する考えを示した。", "points": ["読売新聞などが、首相が「私の代で突破口」と述べたと報じた。", "首相は昨年11月の集会でも、北朝鮮側に首脳会談を打診したと明らかにしていた。", "10月には、米朝会談が実現した場合の働きかけをトランプ米大統領に依頼したと報じられた。"], "background": "拉致問題は被害者家族の高齢化が進み、解決が急がれている。北朝鮮は拉致問題を「解決済み」とする立場で、これまで具体的な返答は確認されていない。", "precedents": "2002年と2004年に小泉純一郎首相が訪朝し、5人の拉致被害者とその家族が帰国した。", "history": "日朝首脳会談は2004年の小泉首相と金正日総書記の会談以来行われていない。2014年のストックホルム合意も、のちに途絶えた。", "outlook": "米朝首脳会談の行方と、北朝鮮が日本との対話に応じるかが注目される。", "check": {"level": "partial", "note": "11月8日の発言自体は検索で直接確認できず。過去の打診や10月の依頼は複数媒体で確認。"}, "sources": [{"name": "秋田魁新報｜首相「日朝首脳会談を打診した」 拉致被害者の帰国求める集会で", "url": "https://www.sakigake.jp/news/article/20251103CO0055/"}, {"name": "首相官邸｜国民大集会", "url": "https://www.kantei.go.jp/jp/104/actions/202511/03rachi.html"}, {"name": "NHK｜拉致被害者家族との面会", "url": "https://news.web.nhk/newsweb/na/nd-20261006de55168"}]}, {"id": "s3", "cat": "外交", "when": "11月9日", "title": "日越首脳会談、重要鉱物・原子力で共同声明を調整", "lede": "NHKによると、高市首相とベトナム側の首脳会談が9日に開かれ、重要鉱物や原子力での連携を盛り込む共同声明が調整されている。", "points": ["NHKは、会談で重要鉱物や原子力の連携を共同声明に盛り込む方向と伝えた。", "ベトナムの最高指導者は、日本からのさらなる投資や協力に期待を示した。", "5月のハノイでの会談では、重要鉱物の供給網での連携で一致していた。"], "background": "日本は、中国に依存する重要鉱物の調達先を広げたい。ベトナムはレアアースの資源を持ち、日本の投資と技術に期待する。", "precedents": "2023年に日越は「包括的戦略的パートナーシップ」へ関係を格上げした。", "history": "日本は1990年代からベトナムへの最大級の政府開発援助国で、経済関係を深めてきた。", "outlook": "共同声明の具体的な中身と、原子力協力の範囲が焦点となる。", "check": {"level": "partial", "note": "11月9日の会談と声明内容は、検索ではNHK報道以外に確認できず。5月の会談は外務省・首相官邸の資料で確認。"}, "sources": [{"name": "首相官邸｜日越首脳会談（5月）", "url": "https://www.kantei.go.jp/jp/105/actions/202605/02vietnam2.html"}, {"name": "秋田魁新報｜日越、重要鉱物の供給連携で一致", "url": "https://www.sakigake.jp/news/article/20260502CO0066/"}]}, {"id": "s4", "cat": "企業・市場", "when": "11月6日", "title": "KDDIとnewmoが資本業務提携 堺で自動運転タクシー", "lede": "KDDIとnewmoは、2028年に大阪府堺市で自動運転タクシーを商用化することをめざし、資本業務提携を結んだ。", "points": ["KDDIは通信、AI計算基盤、遠隔監視、高精度測位を担う。", "newmoはタクシー事業と自動運転の技術、配車アプリを担当する。", "当面は、商用運行でも安全のための運転手が同乗する見込み。"], "background": "堺市は国の自動運転の社会実装を進める事業の対象地域で、実証が進む。8月には堺市自動運転タクシー実装コンソーシアムが設立された。", "precedents": "米国ではWaymoが一部都市で自動運転タクシーを商用運行している。", "history": "日本では2023年に、運転者のいない「レベル4」の走行を認める制度が始まった。", "outlook": "堺で培った運行の仕組みを、全国の地域の交通事業者へ広げられるかが焦点となる。", "check": {"level": "ok", "note": "Impress Watch、Car Watch、堺市の資料など複数の媒体で確認。"}, "sources": [{"name": "Impress Watch｜KDDIとnewmo、自動運転タクシーで資本業務提携", "url": "https://www.watch.impress.co.jp/docs/news/2154440.html"}, {"name": "Car Watch｜KDDIとnewmoの提携", "url": "https://car.watch.impress.co.jp/docs/news/2154535.html"}, {"name": "堺市｜報道提供資料", "url": "https://www.city.sakai.lg.jp/shisei/koho/hodo/hodoteikyoshiryo/kakohodo/r8/r808/080805_02.files/0805_02.pdf"}]}, {"id": "s5", "cat": "外交", "when": "11月8日", "title": "中国で服役のアステラス社員、来月中旬に出所の見通し", "lede": "ロイターは、中国でスパイ罪により服役しているアステラス製薬の日本人社員が、来月中旬に出所し帰国する見通しだと報じた。", "points": ["男性は2023年3月に北京で拘束され、2025年7月に懲役3年6カ月の判決を受けた。", "出所・帰国の時期はロイターの報道で、検索では他媒体の確認がとれていない。", "日中関係は冷え込んでいると報じられている。"], "background": "拘束は帰国直前に起き、中国は反スパイ法違反とした。日本政府は早期の解放を繰り返し求めてきた。", "precedents": "中国では、日本人の拘束が2010年代にも相次ぎ、反スパイ法の運用が各国の企業関係者の不安を招いてきた。", "history": "反スパイ法は2014年に制定され、2023年に対象が広げられた。", "outlook": "予定どおり出所・帰国できるか、日中関係に影響が出るかが注目される。", "check": {"level": "partial", "note": "出所の見通しはロイター一報のみで、他媒体では未確認。拘束と判決の経緯は複数の報道で確認。"}, "sources": [{"name": "時事通信｜拘束のアステラス社員、初公判", "url": "https://sp.m.jiji.com/english/show/37147"}, {"name": "東洋経済オンライン｜アステラス社員の拘束", "url": "https://toyokeizai.net/articles/-/662492"}]}]}], "today": {"2026-11-19": [{"year": "1863", "label": "文久3年", "title": "リンカンがゲティスバーグ演説", "body": "1863年11月19日、リンカン大統領が南北戦争の激戦地ゲティスバーグの国立墓地の開所式で演説した。約2分の短い演説で「人民の、人民による、人民のための政治」を掲げた。手書き稿は複数あり、文言は少しずつ異なる。", "tie": "短い言葉でも、目的を明確に示せば国の進む方向を定める。", "sources": [{"name": "Library of Congress｜Gettysburg Address", "url": "https://loc.gov/exhibits/gettysburg-address/exhibititems.html"}]}, {"year": "1942", "label": "昭和17年", "title": "スターリングラードで反攻作戦開始", "body": "1942年11月19日、ソ連軍は「天王星作戦」でスターリングラードのドイツ軍を包囲する反攻を始めた。数日でドイツ第6軍は包囲され、翌年2月に降伏し、独ソ戦の転換点となった。", "tie": "側面の弱さを放置した拡大は、一度の反撃で崩れる。", "sources": []}, {"year": "1977", "label": "昭和52年", "title": "サダト大統領がイスラエルを訪問", "body": "1977年11月19日、エジプトのサダト大統領が敵対するイスラエルを訪れ、翌日クネセトで演説した。これが1978年のキャンプ・デービッド合意、1979年の平和条約につながった。", "tie": "対立する相手への思い切った訪問が、膠着を動かすことがある。", "sources": []}], "2026-11-18": [{"year": "1883", "label": "明治16年", "title": "北米の鉄道が標準時を導入", "body": "1883年11月18日、米加の鉄道会社が全土を5つの時間帯に分ける標準時を実施した。それまで各地が太陽に基づく独自時刻を使い、鉄道は数十種の時刻に悩まされた。法的な標準時制度は1918年である。", "tie": "民間の実務上の必要が公的制度に先行することがある。共通規格は経済の見えない基盤になる。", "sources": [{"name": "Library of Congress｜Law Blog 標準時の歴史", "url": "https://blogs.loc.gov/law/2024/11/whose-time-is-it-anyway-a-brief-history-of-standardized-time-zones-in-the-united-states/"}]}, {"year": "1918", "label": "大正7年", "title": "ラトビアが独立を宣言", "body": "1918年11月18日、ラトビア人民評議会がリガで独立を宣言した。第一次大戦後の帝国崩壊の中での建国だった。1940年にソ連に併合され、独立の回復は1991年である。", "tie": "独立は宣言だけでなく周囲の力関係に支えられる。小国の安全は国際環境に左右される。", "sources": []}, {"year": "1928", "label": "昭和3年", "title": "『蒸気船ウィリー』が公開", "body": "1928年11月18日、ニューヨークで短編アニメ『蒸気船ウィリー』が公開された。音と映像が同期した作品で、ミッキーマウスの人気を決定づけ、ディズニー社発展の土台となった。", "tie": "新技術をいち早く取り入れた者が市場の標準を作る。知的財産は長く収益を生む。", "sources": []}], "2026-11-17": [{"year": "1869", "label": "明治2年", "title": "スエズ運河が開通", "body": "1869年11月17日、レセップスが率いた地中海と紅海を結ぶスエズ運河が開通した。欧州とアジアの航路は大きく短縮された。1875年には英国がエジプト持株を買収し、運河は国際政治の焦点となった。", "tie": "物流の要衝を誰が握るかは、経済と安全保障の両方を左右する。", "sources": [{"name": "HISTORY｜Suez Canal", "url": "https://www.history.com/topics/19th-century/suez-canal"}]}, {"year": "1997", "label": "平成9年", "title": "北海道拓殖銀行が経営破綻", "body": "1997年11月17日、北海道拓殖銀行が経営破綻し、都市銀行として戦後初の破綻となった。バブル期の不動産融資が不良債権化していた。同月には山一證券も自主廃業を決め、金融危機が深まった。", "tie": "成功体験に基づく過大な投資は、環境が変わると重荷になる。リスクの先送りは大きな代償を招く。", "sources": []}, {"year": "1558", "label": "弘治4年", "title": "エリザベス1世が即位", "body": "1558年11月17日、異母姉メアリー1世の死去を受けてエリザベス1世が即位した。宗教対立で分裂した国を英国国教会体制の再整備で安定させ、約45年の治世は英国の海外進出の基礎を築いた。", "tie": "対立が深い時代には、勝ち負けより妥協点を設計する力が求められる。", "sources": []}], "2026-11-16": [{"year": "1532", "label": "天文元年", "title": "カハマルカ事件 ピサロがインカ皇帝を捕縛", "body": "1532年11月16日、少数のスペイン兵を率いるピサロがカハマルカでインカ皇帝アタワルパを奇襲し捕らえた。日付を15日とする資料もある。皇帝は翌年処刑され、インカ帝国は急速にスペインの支配下に入った。", "tie": "少数でも中枢を押さえれば全体が動く。権力の集中は強さであり、同時に最大の弱点でもある。", "sources": [{"name": "Britannica｜Battle of Cajamarca", "url": "https://www.britannica.com/event/Battle-of-Cajamarca-1532"}]}, {"year": "1945", "label": "昭和20年", "title": "ユネスコ憲章が採択される", "body": "1945年11月16日、ロンドンの会議で国連教育科学文化機関(ユネスコ)の憲章が採択された。発足は1946年。戦争は人の心の中で生まれるとの理念で、教育と文化を通じた平和を掲げた。日本は1951年に加盟した。", "tie": "秩序は軍事力や経済力だけでなく、相互理解という土台でも築ける。", "sources": []}, {"year": "1920", "label": "大正9年", "title": "豪州でカンタス航空が創業", "body": "1920年11月16日、オーストラリアのクイーンズランド州でカンタス航空が設立された。広大な内陸部を結ぶ郵便・旅客輸送が出発点で、のちに国際線へ広がり、世界有数の老舗航空会社となった。", "tie": "地理的な不便は新産業の最大の動機になる。制約が事業の核を決める。", "sources": []}], "2026-11-15": [{"year": "1920", "label": "大正9年", "title": "国際連盟が第1回総会を開く", "body": "1920年11月15日、ジュネーヴで国際連盟の第1回総会が開かれ、41か国が参加した。日本は常任理事国として加わった。提唱国の米国は議会の反対で加盟しなかった。", "tie": "集団安全保障は、大国の参加と実効的な強制力がなければ機能しにくい。", "sources": []}, {"year": "1935", "label": "昭和10年", "title": "フィリピン・コモンウェルスが発足", "body": "1935年11月15日、米国の統治下でフィリピン自治政府（コモンウェルス）が発足し、ケソンが初代大統領に就任した。10年後の独立を予定していたが、日本の占領を経て独立は1946年となった。", "tie": "独立への移行期間は、外部情勢の変化によって計画通りに進むとは限らない。", "sources": []}, {"year": "1988", "label": "昭和63年", "title": "パレスチナ独立宣言", "body": "1988年11月15日、アルジェでPLOのパレスチナ民族評議会がパレスチナ国家の独立を宣言した。同時にイスラエルの存在を事実上認める立場を示し、多数の国が承認した。", "tie": "国家承認と領土の実効支配は別であり、宣言から実現までには長い交渉を要する。", "sources": []}], "2026-11-13": [{"year": "1918", "label": "大正7年", "title": "連合国艦隊がコンスタンティノープルに入る", "body": "1918年11月13日、休戦協定に基づき連合国艦隊がオスマン帝国の首都コンスタンティノープルに入港し、占領が始まった。帝国の解体が進み、のちのトルコ共和国成立へつながっていく。", "tie": "敗戦による秩序の崩壊は、新たな国家の形をめぐる抵抗と再編を生む。", "sources": []}, {"year": "1956", "label": "昭和31年", "title": "米最高裁がバス人種分離を違憲と判断", "body": "1956年11月13日、米連邦最高裁はアラバマ州モンゴメリーのバス車内の人種分離を違憲とする下級審判断を支持した（ブラウダー対ゲイル事件）。約1年続いたバス・ボイコット運動の成果となった。", "tie": "市民の持続的な行動と司法判断が結びつくと、制度は変わりうる。", "sources": []}, {"year": "1974", "label": "昭和49年", "title": "アラファトが国連総会で演説", "body": "1974年11月13日、PLOのアラファト議長が国連総会で演説した。「オリーブの枝と革命家の銃」という表現で知られる。同年のオブザーバー資格付与とともに、パレスチナ問題が国際政治の主題として定着した。", "tie": "武装組織と外交の担い手という二つの顔をどう扱うかは、紛争解決のたびに問われる。", "sources": []}], "2026-11-12": [{"year": "1921", "label": "大正10年", "title": "ワシントン会議が開幕", "body": "1921年11月12日（現地時間）、米大統領ハーディングの呼びかけでワシントン会議が始まった。海軍軍縮条約、四か国条約、九か国条約などが結ばれ、日英同盟は終了した。", "tie": "軍拡競争は、力の均衡を制度で管理する枠組みによって抑えられることがある。", "sources": []}, {"year": "1948", "label": "昭和23年", "title": "東京裁判が判決を言い渡す", "body": "極東国際軍事裁判（東京裁判）は1948年11月12日までに、被告25人に判決を言い渡した。東條英機ら7人が絞首刑、16人が終身刑となった。判事の一部は反対意見を付した。", "tie": "戦争責任の裁きは、法の正当性と政治の現実の間で、いまも評価が分かれ続ける。", "sources": []}, {"year": "1990", "label": "平成2年", "title": "今上天皇の即位礼正殿の儀", "body": "1990年11月12日、皇居で即位礼正殿の儀が行われ、明治憲法下とは異なる日本国憲法下で初めて、天皇の即位が内外に宣明された。国費支出や政教分離を巡る議論も起きた。", "tie": "伝統儀礼を現行憲法の原則とどう両立させるかは、制度の継続に常につきまとう課題である。", "sources": []}], "2026-11-11": [{"year": "1918", "label": "大正7年", "title": "第一次世界大戦の休戦協定", "body": "1918年11月11日午前11時、コンピエーニュの森での休戦協定（署名は早朝）に基づき西部戦線の戦闘が停止し   function isDark(){var m=document.documentElement.getAttribute("data-mode");return m?m==="dark":mq.matches;}
  function syncMode(){modeBtn.setAttribute("aria-pressed",isDark()?"true":"false");}
  modeBtn.addEventListener("click",function(){
    var m=isDark()?"light":"dark";document.documentElement.setAttribute("data-mode",m);
    try{localStorage.setItem("gyoho-mode",m);}catch(e){}
    syncMode();
  });
  if(mq.addEventListener)mq.addEventListener("change",syncMode);
  syncMode();
  window.addEventListener("hashchange",route);
  route();
})();
</script>
</body>
</html>
